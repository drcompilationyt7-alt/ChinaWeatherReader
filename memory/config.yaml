# Bots configuration file
# For N8N based agent system: hermes, creator agent, soul worker, explainer agent
# Full system for @Mr. WorldWideWebster content pipeline

agent:
  version: '1.0.0'
  name: MrWorldWideWebster-Bot
  description: Multi-agent creator system for Mr. WorldWideWebster

memory:
  type: json
  path: ./memory
  persist: true

agents:
  creator:
    enabled: true
    max_videos_per_run: 1
    model: hermes-3

  soul:
    enabled: true
    interval_minutes: 60

  explainer:
    enabled: true
    model: hermes-3

  landscape:
    enabled: false

  clipping:
    enabled: false

  sourcing:
    enabled: true
    youtube:
      max_results: 5

  boost:
    enabled: false

  voiceover:
    enabled: false
