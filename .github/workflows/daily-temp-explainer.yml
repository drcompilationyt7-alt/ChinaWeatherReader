name: Daily Shorts Creation #2 (Asian Edits)

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Override country (optional, clips mode only)'
        required: false
      private:
        description: 'Upload as private (default: false)'
        required: false
        default: 'false'
      publishAt:
        description: 'Override publish time (ISO 8601)'
        required: false
      mode:
        description: 'quiz (World Quiz shorts) or daily (old clip re-upload pipeline)'
        required: false
        default: ''

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
  GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
  GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
  GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
  GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
  OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
  OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
  OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  PRIVATE: "true"
  PUBLISH_HOUR_UTC: "20"
  # quiz = original World Quiz shorts; daily = the old clip re-upload pipeline
  CONTENT_MODE: ${{ github.event.inputs.mode || 'quiz' }}
  # quiz shorts made by this run, scheduled QUIZ_SPACING_HOURS apart from PUBLISH_HOUR_UTC
  QUIZ_COUNT: "1"
  QUIZ_SPACING_HOURS: "4"

jobs:
  create-shorts-2:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean old test data
        run: |
          rm -rf output/ memory/hermes-memory/
          mkdir -p output/clips output/quiz output/assets/voiceovers output/assets/audio memory

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip libgl1 libglib2.0-0

      - name: Install Ollama and pull fallback models (Gemma 4, etc.)
        if: env.CONTENT_MODE != 'quiz'
        run: |
          # Install Ollama for local LLM fallback (title/metadata generation)
          curl -fsSL https://ollama.com/install.sh | sh
          # Wait for Ollama to start
          for i in $(seq 1 10); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama started successfully"
              break
            fi
            echo "Waiting for Ollama to start... ($i/10)"
            sleep 3
          done
          # Pull models in order of preference (gemma4 first, then fallbacks)
          # gemma4 is the primary fallback for metadata generation
          for model in gemma4:latest llama3.2:latest phi4:latest; do
            echo "Pulling Ollama model: $model ..."
            if ollama pull "$model" 2>&1; then
              echo "Successfully pulled $model"
              break
            else
              echo "Failed to pull $model, trying next..."
            fi
          done
          echo "Ollama models ready"

      - name: Install Deno (JS runtime for yt-dlp)
        if: env.CONTENT_MODE != 'quiz'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH

      - name: Install Python dependencies (quiz)
        if: env.CONTENT_MODE == 'quiz'
        run: |
          python3 -m pip install -U pip
          python3 -m pip install pillow numpy edge-tts --break-system-packages

      - name: Install Python dependencies
        if: env.CONTENT_MODE != 'quiz'
        run: |
          python3 -m pip install -U pip
          python3 -m pip install edge-tts yt-dlp yt-dlp-ejs faster-whisper opencv-python-headless ultralytics scenedetect[opencv] transformers sentencepiece sentence-transformers mabwiser river dspy --break-system-packages

      - name: Install Node.js dependencies
        run: |
          npm ci || npm install
          npm install axios

      - name: Install Gemini CLI
        if: env.CONTENT_MODE != 'quiz'
        run: npm install -g @google/gemini-cli

      - name: Cache whisper model
        if: env.CONTENT_MODE != 'quiz'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-v2-${{ runner.os }}

      - name: Pre-download whisper model (with retries for HF rate limit)
        if: env.CONTENT_MODE != 'quiz'
        run: |
          RETRIES=0
          MAX_RETRIES=5
          until python3 -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8'); print('faster-whisper model ready')"; do
            RETRIES=$((RETRIES + 1))
            if [ $RETRIES -ge $MAX_RETRIES ]; then
              echo "whisper download failed after $MAX_RETRIES retries"
              exit 1
            fi
            WAIT=$((RETRIES * 30))
            echo "Rate limited by HF, retrying in ${WAIT}s (attempt $RETRIES/$MAX_RETRIES)..."
            sleep $WAIT
          done

      - name: Pre-download title embedding model (self-learning)
        if: env.CONTENT_MODE != 'quiz'
        run: |
          python3 -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2', device='cpu'); print('MiniLM ready')" || echo "MiniLM unavailable - title ranking falls back to char n-grams"
      - name: Write cookies file
        if: env.CONTENT_MODE != 'quiz'
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          fi

      - name: Set publishAt (4:00 PM EDT = 20:00 UTC)
        run: |
          if [ -n "${{ github.event.inputs.publishAt }}" ]; then
            echo "PUBLISH_AT=${{ github.event.inputs.publishAt }}" >> $GITHUB_ENV
          else
            echo "PUBLISH_AT=$(date -u -d "today ${PUBLISH_HOUR_UTC}:00:00" +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          fi

      - name: Run daily pipeline
        run: |
          COUNTRY_ARG=""
          if [ -n "${{ github.event.inputs.country }}" ]; then
            COUNTRY_ARG="--country ${{ github.event.inputs.country }}"
          fi
          PRIVATE_ARG=""
          if [ "${{ github.event.inputs.private }}" = "true" ] || [ "$PRIVATE" = "true" ]; then
            PRIVATE_ARG="--private"
          fi
          if [ "$CONTENT_MODE" = "quiz" ]; then
            node core/github-action-runner.js --mode quiz --count "$QUIZ_COUNT" $PRIVATE_ARG --publish-at "$PUBLISH_AT"
          else
            node core/github-action-runner.js --mode daily $COUNTRY_ARG $PRIVATE_ARG --publish-at "$PUBLISH_AT"
          fi

      - name: Save memory
        if: always()
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          # add only files that exist: one missing path makes `git add` stage nothing
          for f in memory/channel-memory.json memory/type1-channel-memory.json memory/posted-videos.json \
                   memory/performance-stats.json memory/performance-insights.json memory/quiz-history.json \
                   memory/playlists.json memory/river-views-model.pkl memory/river-seen.json \
                   memory/dspy-title-program.json memory/dspy-title-status.json config/channel-pool.json config/trend-banks; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/yt_cookies.txt 2>/dev/null || true
