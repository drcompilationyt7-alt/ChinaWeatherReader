name: Edit pool refresh (monthly, sound pool, grow-only)

# Monthly GROW-ONLY refresh of the SOUND pool (core/pools/sound_refresh.py; owner 2026-10-17). The daily sound edit
# (sound_11b) uses only pinned, approved hits (core/edit/assets/sound-hit-allowlist.json), so the refresh adds new pinned hits:
#   mine   (4 shards) source discovery with the spare-account cookies (secret YOUTUBE_COOKIES_EDIT, --js-runtimes node, paced,
#          every searched query / seen video remembered in memory/edit-pool-fetch.json) -> hit_scan (dense) -> the
#          VISIBLE-SOURCE gate (core/edit/sound_visible.py) -> <= 3 s minis -> the VISION gate (core/pools/hit_vision.py: two
#          Gemini models must name one obvious action, strict) -> hit_import safety (NudeNet / SigLIP / burned-in text)
#   swap   pull the live pool -> merge (dedupe vs pool / ledger / blocklists / picture signature; GROW-ONLY: nothing is retired)
#          -> visible-source stamp -> AI sharpening (Kaggle GPU Mon-Thu when KAGGLE_API_TOKEN + KAGGLE_USERNAME exist, else CPU
#          within a budget) -> QUALITY BASELINE (core/edit/assets/sound-pins-baseline.json = the sound_11b pins) -> contact sheet of
#          the new hits for the owner (artifact) -> push to the `edit-pools` release + commit the pins (real runs only)
# Schedule: GitHub cron ORs day-of-month and day-of-week, so it fires every Tuesday 05:00 UTC and `plan` exits unless the day
# is <= 7 (= the first Tuesday). Real (scheduled / non-dry) runs need the repository variable EDIT_POOL_REFRESH=on.
# A manual run with dry_run=true (default) mines a small batch through every gate and promotes / pushes / commits NOTHING.

on:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = small batch, every gate, nothing pushed or committed'
        required: false
        default: 'true'
      budget_min:
        description: 'Mining budget per shard in minutes (real run; the dry run uses 60)'
        required: false
        default: '240'
      calibrate:
    needs: plan
    if: github.event.inputs.calibrate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
          python -m pip install -q opencv-python-headless numpy
      - name: Score the vision gate on the by-eye labelled minis (part ${{ matrix.part }} of 6)
        run: |
          mkdir -p calib && gh release download edit-pools-calib --repo "$GITHUB_REPOSITORY" --pattern hit-calib.tar --dir calib
          tar -xf calib/hit-calib.tar -C calib
          python core/pools/hit_vision.py calibrate --dir calib/hit-calib --part ${{ matrix.part }}/6 --out calib/report-${{ matrix.part }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hit-vision-calibration-${{ matrix.part }}
          path: calib/report-*.json
          if-no-files-found: ignore

  calibrate-summary:
    needs: calibrate
    if: ${{ always() && github.event.inputs.calibrate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hit-vision-calibration-*
          path: calib
          merge-multiple: true
      - run: |
          python core/pools/hit_vision.py calibrate --merge calib/report-*.json --out calib/report.json | tee calib/summary.json
          { echo "### Vision gate calibration (by-eye labels)"; echo '```'; cat calib/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hit-vision-calibration
          path: calib/report.json

  mine:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl unzip libgl1 libglib2.0-0 libsndfile1
          node --version
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "yt-dlp[default]" yt-dlp-ejs opencv-python-headless numpy scipy pillow transformers sentencepiece protobuf \
            "librosa==0.11.0" onnxruntime scikit-learn psutil soundfile

      - name: Cache models (SigLIP, NudeNet, anime face)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/clip_finder
          key: edit-refresh-models-v1

      - name: Cookies (spare account)
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt; else echo "::warning::no YOUTUBE_COOKIES_EDIT secret"; fi

      - name: Pull the live sound manifests (dedupe against the pool)
        run: node scripts/edit-pools-store.js pull --manifests-only --preset sound

      - name: Mine shard ${{ matrix.shard }} of 4 (fetch -> hit_scan -> visible-source gate -> vision gate -> safety)
        env:
          BUDGET: ${{ needs.plan.outputs.dry == 'true' && '60' || github.event.inputs.budget_min || '240' }}
          NQ: ${{ needs.plan.outputs.dry == 'true' && '2' || '6' }}
          NSRC: ${{ needs.plan.outputs.dry == 'true' && '3' || '12' }}
        run: |
          python core/pools/sound_refresh.py mine --work work --shard ${{ matrix.shard }}/4 --budget-min "$BUDGET" \
            --queries "$NQ" --max-sources "$NSRC" | tail -c 4000
          du -sh work/out || true
          rm -f /tmp/yt_cookies.txt

      - name: Upload the shard (approved minis, verdicts, strips, fetch state)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-shard-${{ matrix.shard }}
          path: work/out
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  swap:
    needs: [plan, mine]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && (needs.mine.result == 'success' || needs.mine.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libsndfile1
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install opencv-python-headless numpy scipy pillow transformers sentencepiece protobuf "librosa==0.11.0" \
            onnxruntime scikit-learn psutil soundfile kaggle

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/clip_finder
            ~/.cache/edit_upscale_models
          key: edit-refresh-models-v1

      - name: Pull the live sound pool
        run: node scripts/edit-pools-store.js pull --preset sound

      - name: Download the shards
        uses: actions/download-artifact@v4
        with:
          pattern: sound-shard-*
          path: shards

      - name: Merge (grow-only) -> stamp -> sharpen -> baseline check -> contact sheet
        id: swap
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          SHARPEN_MIN: ${{ needs.plan.outputs.dry == 'true' && '60' || '200' }}
        run: |
          set -e
          mkdir -p report
          ls shards || true
          python core/pools/sound_refresh.py merge --pool "$EDIT_POOL_DIR" --from shards/* --new report/new.json | tail -c 3000
          python - <<'PY' > report/new-ids.json
          import json; print(json.dumps([n['id'] for n in json.load(open('report/new.json'))]))
          PY
          python core/pools/pool_visible.py stamp --dir "$EDIT_POOL_DIR" --ids report/new-ids.json || echo "::warning::visible-source stamp failed"
          python core/pools/sound_refresh.py sharpen --pool "$EDIT_POOL_DIR" --new report/new.json --budget-min "$SHARPEN_MIN" | tail -c 2000
          python core/pools/sound_refresh.py check --pool "$EDIT_POOL_DIR" --new report/new.json --out report/check-report.json | tail -c 3000
          python core/pools/sound_refresh.py sheet --pool "$EDIT_POOL_DIR" --new report/new.json --out report/new-hits.jpg
          KEPT=$(python -c "import json; print(len(json.load(open('report/new.json'))))")
          echo "kept=$KEPT" >> $GITHUB_OUTPUT
          {
            echo "### Sound pool refresh (dry run: $DRY_RUN): $KEPT new pinned hits"
            echo '```'; head -c 3000 report/check-report.json; echo '```'
            for f in shards/*/report.json; do echo '```'; python -c "import json,sys; d=json.load(open('$f')); d.pop('scan',None); print(json.dumps(d))"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
          cp shards/*/verdicts.json report/ 2>/dev/null || true
          for d in shards/*/; do cp "$d/verdicts.json" "report/verdicts-$(basename $d).json" 2>/dev/null || true; done

      - name: Upload the report and the contact sheet of the new hits (for the owner)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-pool-refresh-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            report/*.json
            report/*.jpg
          retention-days: 30

      - name: Push the grown pool + commit the new pins (real runs only)
        if: steps.swap.outcome == 'success' && env.DRY_RUN != 'true' && steps.swap.outputs.kept != '0'
        run: |
          node scripts/edit-pools-store.js push --preset sound
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add core/edit/assets/sound-hit-allowlist.json memory/edit-pool-fetch.json
          git commit -m "Sound pool refresh $(date +%F): ${{ steps.swap.outputs.kept }} new pinned hits" || exit 0
          for i in 1 2 3; do git -c rebase.autoStash=true pull --rebase origin main && git push && break; sleep 5; done

      - name: Save the fetch state (real runs with no new hits)
        if: steps.swap.outcome == 'success' && env.DRY_RUN != 'true' && steps.swap.outputs.kept == '0'
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add memory/edit-pool-fetch.json && git commit -m "Sound pool refresh $(date +%F): fetch state" || exit 0
          for i in 1 2 3; do git -c rebase.autoStash=true pull --rebase origin main && git push && break; sleep 5; done
