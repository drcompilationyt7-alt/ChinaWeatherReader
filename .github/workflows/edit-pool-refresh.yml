name: Sound pool growth (nightly until the target, staged, grow-only)

# GROW-ONLY growth of the SOUND pool (core/pools/sound_refresh.py; owner 2026-10-17, nightly + staged since 2026-10-20: "growing
# pool, we can reuse the clips but just variety"). The daily sound edit (sound_11b) uses only pinned, approved hits
# (core/edit/assets/sound-hit-allowlist.json), so growth = new pinned hits:
#   mine   (6 shards since 2026-10-21, was 4: all shards search the same night's queries, each downloads only its own
#          videos = crc32(video id) % 6) source discovery with the spare-account cookies (secret YOUTUBE_COOKIES_EDIT, --js-runtimes node, paced,
#          every searched query / seen video remembered in memory/edit-pool-fetch.json) -> hit_scan (dense) -> the
#          VISIBLE-SOURCE gate (core/edit/sound_visible.py) -> <= 3 s minis -> the VISION gate (core/pools/hit_vision.py: two
#          Gemini models must name one obvious action, strict; a cheap CPU pre-filter core/pools/clip_prefilter.py drops
#          off-hit / tiny / off-centre / wide chaotic minis before the paid call) -> hit_import safety (NudeNet / SigLIP / text)
#   swap   pull the live pool (a CI copy) -> merge (dedupe vs pool / ledger / blocklists / picture signature) -> visible-source
#          stamp -> AI sharpening -> QUALITY BASELINE check -> contact sheet -> STAGE: the new clips + their rows / pins as
#          sound-cand-<date>-n<N>.tar on the release `edit-pools-staging`. NOTHING reaches the live pool here; only the fetch
#          state is committed.
#   import (workflow_dispatch with import_tars) after the by-eye review of the staged contact sheets (Claude at session start:
#          `python core/pools/sound_refresh.py pull-staged`): pull the FULL live pool -> apply-staged minus `reject` ->
#          push the pool (edit-pools) + commit the pins -> delete the imported tars from staging.
# Schedule: nightly 05:45 UTC (after the slow-mo miner, which uses the same spare account) while the live pins are under
# SOUND_POOL_TARGET (repository variable, default 230 = ~25 % reuse over 5 videos in the 30-video simulation) and fewer than 4
# staged tars wait for review; at / above the target only the first Tuesday of the month mines. Off: EDIT_POOL_REFRESH=off.
# A manual run with dry_run=true (default) mines a small batch through every gate and stages / commits NOTHING.

on:
  # 2026-10-21: NO own schedule. Mining is one light nightly rotation (pool-mine-nightly.yml, called=true, ONE shard). Manual dispatch stays: dry run, calibrate, and the IMPORT mode.
  workflow_call:
    inputs:
      called:
        type: string
        default: 'false'
      dry_run:
        type: string
        default: 'false'
      budget_min:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      called:
        description: 'leave false'
        required: false
        default: 'false'
      dry_run:
        description: 'true = small batch, every gate, nothing pushed or committed'
        required: false
        default: 'true'
      budget_min:
        description: 'Mining budget in minutes (real run; the dry run uses 60; empty: 150)'
        required: false
        default: ''
      calibrate:
        description: 'Also score the vision gate on the labelled by-eye set (release edit-pools-calib)'
        required: false
        default: 'false'
      import_tars:
        description: 'IMPORT mode: reviewed staged tars (sound-cand-....tar, space separated) to add to the live pool; no mining'
        required: false
        default: ''
      reject:
        description: 'IMPORT mode: clip ids rejected in the review (comma separated)'
        required: false
        default: ''

concurrency:
  group: ${{ inputs.called == 'true' && format('pool-mine-called-{0}', github.run_id) || 'pool-mine' }}
  cancel-in-progress: false

env:
  EDIT_POOL_DIR: output/edit-pools
  EDIT_CACHE: /home/runner/.cache/clip_finder
  YT_COOKIES: /tmp/yt_cookies.txt
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES_EDIT }}
  YT_FORCE_IPV4: '1'
  YT_COOKIE_COPY: '1'
  GH_PAT: ${{ secrets.GH_PAT }}
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
  GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
  GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
  GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
  GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
  PYTHONIOENCODING: utf-8
  EDIT_GPU: '0'
  EDIT_THREADS: '4'
  OMP_NUM_THREADS: '4'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.gate.outputs.go }}
      dry: ${{ steps.gate.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate (pins vs target, review backlog, first Tuesday once at the target, off switch, import mode, dry run)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          TARGET: ${{ vars.SOUND_POOL_TARGET || '230' }}
        run: |
          DRY="${{ inputs.dry_run || 'false' }}"
          GO=true
          if [ -n "${{ inputs.import_tars }}" ]; then echo "Import mode: no mining."; GO=false; fi
          PINS=$(python3 -c "import json; print(len(json.load(open('core/edit/assets/sound-hit-allowlist.json')).get('clips') or {}))")
          STAGED=$(gh release view edit-pools-staging --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -c '^sound-cand-' || true)
          echo "live pins $PINS (target $TARGET), staged tars waiting for review: $STAGED"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.called }}" = "true" ]; then
            DRY=false
            if [ "$PINS" -ge "$TARGET" ] && { [ "$(date -u +%d)" -gt 7 ] || [ "$(date -u +%u)" != "2" ]; }; then
              echo "At the target: only the first Tuesday of the month mines."; GO=false
            fi
            if [ "$STAGED" -ge 4 ]; then echo "::notice::$STAGED staged sound tars wait for review: no mining tonight."; GO=false; fi
          fi
          echo "go=$GO" >> $GITHUB_OUTPUT
          echo "dry=$DRY" >> $GITHUB_OUTPUT

  calibrate:
    needs: plan
    if: inputs.calibrate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
          python -m pip install -q opencv-python-headless numpy
      - name: Score the vision gate on the by-eye labelled minis (part ${{ matrix.part }} of 6)
        run: |
          mkdir -p calib && gh release download edit-pools-calib --repo "$GITHUB_REPOSITORY" --pattern hit-calib.tar --dir calib
          tar -xf calib/hit-calib.tar -C calib
          python core/pools/hit_vision.py selftest
          python core/pools/hit_vision.py calibrate --dir calib/hit-calib --part ${{ matrix.part }}/6 --out calib/report-${{ matrix.part }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hit-vision-calibration-${{ matrix.part }}
          path: calib/report-*.json
          if-no-files-found: ignore

  calibrate-summary:
    needs: calibrate
    if: ${{ always() && inputs.calibrate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hit-vision-calibration-*
          path: calib
          merge-multiple: true
      - run: |
          python3 core/pools/hit_vision.py calibrate --merge calib/report-*.json --out calib/report.json | tee calib/summary.json
          { echo "### Vision gate calibration (by-eye labels)"; echo '```'; cat calib/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hit-vision-calibration
          path: calib/report.json
          if-no-files-found: ignore

  mine:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 235     # hard cap. 2026-10-24: mine 235 + swap 60 + pick/plan ~2 = inside the 5 h nightly; mining is TIME-BASED
    strategy:
      max-parallel: 1
      matrix:
        shard: [0]               # ONE shard (k=0, n=1): crc32(id) % 1 == 0 keeps every video exactly once
    steps:
      - name: Job clock (the mining budget is counted from the job start, setup included)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl unzip libgl1 libglib2.0-0 libsndfile1
          node --version
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "yt-dlp[default]" yt-dlp-ejs opencv-python-headless numpy scipy pillow transformers sentencepiece protobuf \
            "librosa==0.11.0" onnxruntime scikit-learn psutil soundfile

      - name: Cache models (SigLIP, NudeNet, anime face)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/clip_finder
          key: edit-refresh-models-v1

      - name: Cookies (spare account)
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt; else echo "::warning::no YOUTUBE_COOKIES_EDIT secret"; fi

      - name: Pull the live sound manifests (dedupe against the pool)
        run: node scripts/edit-pools-store.js pull --manifests-only --preset sound

      - name: Mine shard ${{ matrix.shard }} (fetch -> hit_scan -> visible-source gate -> pre-filter -> vision gate -> safety)
        env:
          BUDGET_IN: ${{ needs.plan.outputs.dry == 'true' && '60' || inputs.budget_min || '' }}
          NQ: ${{ needs.plan.outputs.dry == 'true' && '2' || '120' }}
          NSRC: ${{ needs.plan.outputs.dry == 'true' && '3' || '90' }}
          NSH: '1'
          REFRESH_PER_SOURCE: '14'
          SOUND_VID_SHARD: '1'
        run: |
          python core/pools/clip_prefilter.py selftest > /dev/null
          python core/pools/sound_refresh.py selftest > /dev/null
          # 2026-10-24 TIME-BASED: fetch / scan / judge in batches until the budget = 220 min after the job start (setup
          # included) minus nothing else; the loop stops new fetches ~30 min before the end, so the judging and the artifact
          # upload finish inside the 235 min cap, and the swap job (<= 60 min) stages inside the 5 h nightly.
          SPENT=$(( ($(date +%s) - JOB_T0) / 60 ))
          BUDGET=$(( 220 - SPENT ))
          if [ -n "$BUDGET_IN" ] && [ "$BUDGET_IN" -lt "$BUDGET" ]; then BUDGET=$BUDGET_IN; fi
          echo "setup took $SPENT min; mining budget $BUDGET min, <= $NSRC sources, <= $NQ queries"
          python core/pools/sound_refresh.py mine --work work --shard ${{ matrix.shard }}/$NSH --budget-min "$BUDGET" \
            --queries "$NQ" --max-sources "$NSRC" | tail -c 4000
          du -sh work/out || true
          rm -f /tmp/yt_cookies.txt

      - name: Upload the shard (approved minis, verdicts, strips, fetch state)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-shard-${{ matrix.shard }}
          path: work/out
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  swap:
    needs: [plan, mine]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && (needs.mine.result == 'success' || needs.mine.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60      # hard cap; sharpening is bounded to 20 min so staging always finishes (inside the 5 h nightly)
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libsndfile1
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install opencv-python-headless numpy scipy pillow transformers sentencepiece protobuf "librosa==0.11.0" \
            onnxruntime scikit-learn psutil soundfile kaggle

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/clip_finder
            ~/.cache/edit_upscale_models
          key: edit-refresh-models-v1

      - name: Pull the live sound pool
        run: node scripts/edit-pools-store.js pull --preset sound

      - name: Download the shards
        uses: actions/download-artifact@v4
        with:
          pattern: sound-shard-*
          path: shards

      - name: Merge (grow-only) -> stamp -> sharpen -> baseline check -> contact sheet
        id: swap
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          SHARPEN_MIN: '20'
        run: |
          set -e
          mkdir -p report
          ls shards || true
          python core/pools/sound_refresh.py merge --pool "$EDIT_POOL_DIR" --from shards/* --new report/new.json | tail -c 3000
          python - <<'PY' > report/new-ids.json
          import json; print(json.dumps([n['id'] for n in json.load(open('report/new.json'))]))
          PY
          python core/pools/pool_visible.py stamp --dir "$EDIT_POOL_DIR" --ids report/new-ids.json || echo "::warning::visible-source stamp failed"
          python core/pools/sound_refresh.py sharpen --pool "$EDIT_POOL_DIR" --new report/new.json --budget-min "$SHARPEN_MIN" | tail -c 2000
          python core/pools/sound_refresh.py check --pool "$EDIT_POOL_DIR" --new report/new.json --out report/check-report.json | tail -c 3000
          python core/pools/sound_refresh.py sheet --pool "$EDIT_POOL_DIR" --new report/new.json --out report/new-hits.jpg
          KEPT=$(python -c "import json; print(len(json.load(open('report/new.json'))))")
          echo "kept=$KEPT" >> $GITHUB_OUTPUT
          {
            echo "### Sound pool refresh (dry run: $DRY_RUN): $KEPT new pinned hits"
            echo '```'; head -c 3000 report/check-report.json; echo '```'
            for f in shards/*/report.json; do echo '```'; python -c "import json,sys; d=json.load(open('$f')); d.pop('scan',None); print(json.dumps(d))"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
          cp shards/*/verdicts.json report/ 2>/dev/null || true
          for d in shards/*/; do cp "$d/verdicts.json" "report/verdicts-$(basename $d).json" 2>/dev/null || true; done

      - name: Upload the report and the contact sheet of the new hits (for the owner)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-pool-refresh-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            report/*.json
            report/*.jpg
          retention-days: 30

      - name: Stage the new clips for review (edit-pools-staging; nothing reaches the live pool) + save the fetch state
        if: steps.swap.outcome == 'success' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          if [ "${{ steps.swap.outputs.kept }}" != "0" ]; then
            python core/pools/sound_refresh.py stage --pool "$EDIT_POOL_DIR" --new report/new.json --out stage --sheets 'report/new-hits*.jpg' | tail -c 2000
            gh release view edit-pools-staging --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create edit-pools-staging --repo "$GITHUB_REPOSITORY" --title "edit pools staging" --notes "candidates for review" --prerelease
            for t in stage/sound-cand-*.tar; do [ -e "$t" ] && gh release upload edit-pools-staging "$t" --clobber --repo "$GITHUB_REPOSITORY"; done
            echo "staged: $(ls stage/*.tar 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git checkout -- core/edit/assets/sound-hit-allowlist.json 2>/dev/null || true   # pins land only with the reviewed import
          git add memory/edit-pool-fetch.json && git commit -m "Sound pool growth $(date +%F): fetch state (${{ steps.swap.outputs.kept }} staged)" || exit 0
          for i in 1 2 3; do git -c rebase.autoStash=true pull --rebase origin main && git push && break; sleep 5; done

  import:
    needs: plan
    if: inputs.import_tars != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull the FULL live sound pool
        run: node scripts/edit-pools-store.js pull --preset sound
      - name: Apply the reviewed staged tars (minus the rejects), push the pool, commit the pins, delete the tars
        run: |
          set -e
          mkdir -p imp
          for t in ${{ inputs.import_tars }}; do
            gh release download edit-pools-staging --repo "$GITHUB_REPOSITORY" --pattern "$t" --dir imp
          done
          python core/pools/sound_refresh.py apply-staged --pool "$EDIT_POOL_DIR" --tars imp/*.tar --reject "${{ inputs.reject }}" | tee imp/apply.json
          node scripts/edit-pools-store.js push --preset sound
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add core/edit/assets/sound-hit-allowlist.json
          git commit -m "Sound pool growth: import of reviewed staged clips (${{ inputs.import_tars }})" || true
          for i in 1 2 3; do git -c rebase.autoStash=true pull --rebase origin main && git push && break; sleep 5; done
          for t in ${{ inputs.import_tars }}; do gh release delete-asset edit-pools-staging "$t" --repo "$GITHUB_REPOSITORY" -y || true; done
          { echo "### Sound pool import"; echo '```'; tail -c 2000 imp/apply.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
