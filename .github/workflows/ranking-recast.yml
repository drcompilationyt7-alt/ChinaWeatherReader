name: Ranking pool recast (character share + other-character runs)

# Owner 2026-11-07: a "strongest" entry must be that character's edit - short cutaways to another character are fine, a
# sustained stretch of another one is not. ranking_pool.py recast measures every live section's per-character screen share
# ('cast') and the longest stretch other characters own ('cast_runs') on its current window, then the live pool is pushed.
# Dispatch by hand after a manifest change (the owner PC keeps its RAM rule: the character models run here).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Only these item ids (comma-separated); empty = every reviewed item'
        required: false
        default: ''

concurrency:
  group: ranking-recast   # the live pool only; mining writes staging (no clash)
  cancel-in-progress: false

env:
  EDIT_POOL_DIR: output/edit-pools
  GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
  PYTHONIOENCODING: utf-8
  EDIT_GPU: '0'
  EDIT_THREADS: '4'
  OMP_NUM_THREADS: '4'
  RANKING_MIN_FREE_GB: '1.5'

jobs:
  recast:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libsndfile1
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install opencv-python-headless numpy scipy pillow transformers sentencepiece protobuf \
            "librosa==0.11.0" onnxruntime scikit-learn psutil soundfile rapidocr-onnxruntime
      - name: Cache models (SigLIP, NudeNet, anime face, WD tagger)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/clip_finder
            ~/.cache/wd_tagger
          key: ranking-mine-models-v1
      - name: Pull the live ranking pool
        run: node scripts/edit-pools-store.js pull --preset ranking
      - name: Recast
        env:
          IDS: ${{ inputs.ids }}
        run: |
          set -o pipefail
          python core/edit/ranking_pool.py recast --ids "$IDS" | tee recast.json | tail -c 6000
          { echo "### Ranking recast"; echo '```'; cat recast.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push the live ranking pool
        run: node scripts/edit-pools-store.js push --preset ranking
