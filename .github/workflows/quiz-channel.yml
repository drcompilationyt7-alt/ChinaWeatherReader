name: Quiz Channel (Asian pop culture quizzes)

# Second YouTube channel: quiz + would-you-rather shorts. It has its own OAuth
# secrets (QUIZ_YOUTUBE_*) and its own memory folder (memory/quiz-channel), so
# nothing here touches the Mr. WorldWideWebster channel. Until the secrets
# exist every run exits early without doing anything.

on:
  schedule:
    # one short a day, published at 12:00 UTC (8 PM in China/SEA, 8 AM US East). The render starts
    # ~10 h early (GitHub can start scheduled runs late); the 07:17 run is a backup that only
    # works if the 02:17 one didn't upload today's short.
    - cron: '17 2 * * *'
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Shorts to make in this run'
        required: false
        default: ''
      format:
        description: 'Force a format (optional: song, voice, character, idol, opening, scene, duel, cityphoto, vtuber, emoji, trivia, wyr, city, flag, shape, silhouette, eyes, outfit)'
        required: false
        default: ''
      dry_run:
        description: 'Render only, attach the mp4s to the run, upload nothing'
        required: false
        default: 'false'

concurrency:
  group: quiz-channel
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
  GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
  GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
  GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
  GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  YOUTUBE_CLIENT_ID: ${{ secrets.QUIZ_YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.QUIZ_YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.QUIZ_YOUTUBE_REFRESH_TOKEN }}
  # cookies for yt-dlp (anime opening clips); same secret the main channel uses
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YT_COOKIES: /tmp/yt_cookies.txt
  QUIZ_MEDIA_CACHE: /home/runner/.cache/quiz-media
  MEMORY_DIR: memory/quiz-channel
  # Asian pop culture formats + Asia editions of the geography quizzes (a forced format must be in the
  # list too). `voice` draws only from voice-lines.json: uploads that name the character (and the show),
  # each clip confirmed as Japanese speech by faster-whisper, re-checked at render time.
  # nightcity / cuisine: nightly-mined pools; the balancer keeps them off until 15 reviewed items exist (QUIZ_NEW_POOL_MIN)
  QUIZ_FORMATS: song,voice,character,idol,opening,scene,duel,cityphoto,vtuber,emoji,trivia,wyr,city,flag,shape,silhouette,eyes,outfit,nightcity,cuisine
  QUIZ_THEME: asia
  WATERMARK: ${{ vars.QUIZ_WATERMARK || '@asianpopquiz' }}
  QUIZ_SPACING_HOURS: "9"
  QUIZ_PER_DAY: ${{ vars.QUIZ_PER_DAY || '2' }}
  # 2026-10-11 (owner approved): new formats (silhouette / eyes / outfit), themed editions (Halloween in its window 10-15..10-31 first,
  # beach / festival ~1 in 4, winter and valentine in their windows), animated looping backgrounds, AI narrator lines (fixed pools as
  # fallback), moving watermark. Off until verified: POP_PRONOUNCE (phonetic respelling).
  POP_NEW_FORMATS: "1"
  POP_THEMES: "halloween,beach,festival,winter,valentine,glasses,villains,maid"
  POP_SEASONAL_RATE: "0.34"    # Halloween (Oct 15-31) on about 1 in 3 videos (owner 2026-10-12)
  POP_ANIM_BG: "1"
  POP_AI_LINES: "1"
  POP_BG_CACHE: /home/runner/.cache/pop_quiz_bg
  # watermark: moving 40 % handle on 3 safe spots + a faint second mark (sample frames checked 2026-10-11)
  POP_WATERMARK: "1"
  # narrator: Chatterbox, calm and cool (falls back to Kokoro am_onyx, then edge-tts)
  TTS_ENGINE: chatterbox
  CHATTERBOX_EXAGGERATION: "0.3"
  CHATTERBOX_CFG: "0.6"
  KOKORO_VOICE: am_onyx
  KOKORO_PITCH: "-2"
  KOKORO_DIR: /home/runner/.cache/kokoro
  QUIZ_FORMAT: ${{ github.event.inputs.format }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check channel secrets
        id: gate
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then
            echo "QUIZ_YOUTUBE_REFRESH_TOKEN is not set yet - see QUIZ-CHANNEL-SETUP.md. Nothing to do."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: One short a day
        id: today
        if: steps.gate.outputs.ready == 'true' && github.event_name == 'schedule'
        run: |
          # QUIZ_PER_DAY shorts a day (08:00 + 17:00 New York = 12:00 + 21:00 UTC); a backup run makes only the missing ones
          N=$(node -e "const h=require('./memory/quiz-channel/quiz-history.json'); const d=new Date().toISOString().slice(0,10); console.log((h.uploads||[]).filter(u=>String(u.postedAt||'').startsWith(d)).length)" 2>/dev/null || echo 0)
          echo "uploaded_today=$N" >> $GITHUB_OUTPUT
          if [ "$N" -ge "$QUIZ_PER_DAY" ]; then
            echo "Today's $QUIZ_PER_DAY shorts are already uploaded; this backup run has nothing to do."
            echo "done=true" >> $GITHUB_OUTPUT
          else
            echo "done=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu --break-system-packages
          python3 -m pip install chatterbox-tts --break-system-packages
          python3 -m pip install pillow edge-tts yt-dlp yt-dlp-ejs kokoro-onnx soundfile scipy --break-system-packages
          # speech check for the voice quiz (Whisper tiny on CPU; the model is cached with the voice models)
          python3 -m pip install faster-whisper --break-system-packages
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          npm ci || npm install
          mkdir -p output/quiz "$MEMORY_DIR" "$QUIZ_MEDIA_CACHE"
          if [ -n "$YOUTUBE_COOKIES" ]; then printf '%s\n' "$YOUTUBE_COOKIES" > "$YT_COOKIES"; fi

      - name: Cache voice models (Chatterbox, Kokoro, faster-whisper tiny)
        if: steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/huggingface
            /home/runner/.cache/kokoro
          key: voice-models-chatterbox-whisper-v2
          restore-keys: voice-models-chatterbox-

      - name: Cache animated background loops (rendered once, ~1-2 min each on CPU)
        if: steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pop_quiz_bg
          key: pop-bg-loops-v4-${{ hashFiles('core/quiz/bg_anim.py') }}

      - name: Cache quiz media (images, opening clips)
        if: steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/quiz-media
          key: quiz-media-${{ github.run_id }}
          restore-keys: quiz-media-

      - name: Make and upload quiz shorts
        if: steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        run: |
          # QUIZ_PER_DAY shorts, the first at 12:00 UTC, the next QUIZ_SPACING_HOURS later; a backup run fills only the
          # missing slots (a slot whose time has passed goes out right away)
          DONE="${{ steps.today.outputs.uploaded_today }}"; DONE=${DONE:-0}
          COUNT=$(( QUIZ_PER_DAY - DONE )); [ "$COUNT" -lt 1 ] && COUNT=1
          if [ -n "${{ github.event.inputs.count }}" ]; then COUNT="${{ github.event.inputs.count }}"; DONE=0; fi
          export PUBLISH_AT=$(node -e "const d=new Date(); d.setUTCHours(12,0,0,0); d.setTime(d.getTime()+$DONE*$QUIZ_SPACING_HOURS*3600e3); console.log(d.toISOString().replace(/\.000Z$/,'Z'))")
          node core/github-action-runner.js --mode quiz --count "$COUNT" --private --publish-at "$PUBLISH_AT"

      - name: Keep renders (every short, uploaded or not, for review)
        if: always() && steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quiz-renders
          if-no-files-found: ignore
          path: output/quiz/*.mp4
          retention-days: 7

      - name: Remove cookies
        if: always()
        run: rm -f /tmp/yt_cookies.txt

      - name: Save memory
        if: always() && steps.gate.outputs.ready == 'true' && steps.today.outputs.done != 'true'
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          if [ -d "$MEMORY_DIR" ]; then git add "$MEMORY_DIR"; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Quiz channel memory $(date +%F)"
          for i in 1 2 3; do
            git -c rebase.autoStash=true pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
