name: Bi-Weekly Memory & Output Cleanup

on:
  schedule:
    # Runs every two weeks on Sunday at 00:00 UTC
    - cron: '0 0 */14 * *'
  workflow_dispatch:

jobs:
  clear-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reset channel-memory.json
        run: |
          cat > memory/channel-memory.json << 'JSONEOF'
{
  "channelName": "Mr. WorldWideWebster",
  "tagline": "Bringing the world to you",
  "targetAudience": "Global culture enthusiasts, travelers, people curious about international trends",
  "createdAt": "$(date -u +%Y-%m-%dT00:00:00.000Z)",
  "totalVideosPosted": 0,
  "lastCountryUsed": "",
  "countriesUsedThisWeek": [],
  "bestPerformingFormats": [],
  "titleFormulas": [
    "What is this [thing]? ([country] edition)",
    "[country]'s favorite [category] right now",
    "Americans don't understand [country] [thing]",
    "[country] vs [country]: Who does it better?",
    "This [category] from [country] is going viral"
  ],
  "postingSchedule": {
    "hour": 6,
    "minute": 0,
    "timezone": "UTC"
  },
  "skills": [],
  "lastUpdated": "$(date -u +%Y-%m-%dT00:00:00.000Z)",
  "lastContentType": "",
  "usedTopics": []
}
JSONEOF

      - name: Reset content-history.json
        run: |
          echo '{"videos":[]}' > memory/content-history.json

      - name: Remove cache dump files
        run: |
          rm -f memory/models_dev_cache.json
          rm -f memory/state.db memory/state.db-shm memory/state.db-wal
          rm -f memory/performance-metrics.json
          rm -f memory/trending-log.json
          rm -rf memory/sessions

      - name: Clean output folder (bi-weekly)
        run: |
          rm -rf output/clips/* output/assets/* output/temp/* 2>/dev/null || true
          rm -rf output/scripts/* output/long-form/* 2>/dev/null || true
          echo "✅ Output folder cleaned"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bi-weekly memory & output cleanup [skip ci]"
          git push