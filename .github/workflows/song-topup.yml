name: Song list top-up (monthly, automatic)

# Adds new trending Asian / anime songs to the stem edit's list (pipeline/meme-pipeline.js) with NO manual approval, but
# only through quality gates (pipeline/song-topup.js): niche + known non-NSFW source, official upload with >= 1M views and a
# recent trend, enough usable source clips (search-only dry run), not a duplicate / not blocked before, at most 10 a month.
# New songs enter on probation; Thompson sampling keeps winners and the monthly run retires auto-added losers.
# Every verdict is logged to memory/song-topup-YYYY-MM.json (committed with config/song-candidates.json).
# ENABLED by default. Set the repository variable SONG_TOPUP=off to stop it. CPU only, no Kaggle.
#
# GitHub cron ORs day-of-month and day-of-week: it fires every Tuesday 05:30 UTC and the first step exits unless the day of
# the month is <= 7 (= the first Tuesday). A manual run always goes.

on:
  schedule:
    - cron: '30 5 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the gates and print the verdicts; write and commit nothing'
        required: false
        default: 'false'

concurrency:
  group: song-topup
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES_TOPUP || secrets.YOUTUBE_COOKIES }}   # spare-account cookies for the top-up only (owner 2026-10-13)
  YT_COOKIES: /tmp/yt_cookies.txt
  YT_JS_RUNTIMES: deno
  MEME_PYTHON: python3

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: vars.SONG_TOPUP != 'off'
    permissions:
      contents: write
    steps:
      - name: First Tuesday only (scheduled runs)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -gt 7 ]; then
            echo "Not the first Tuesday of the month: nothing to do."; echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "go=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 20
      - name: Install
        if: steps.gate.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
        run: |
          # YouTube needs the JS challenge solver: yt-dlp[default] pulls yt-dlp-ejs, node (set up above) runs it
          sudo apt-get install -y -qq ffmpeg || true   # yt-dlp --download-sections (sample check previews) needs it
          python3 -m pip install -U "yt-dlp[default]" opencv-python-headless numpy pillow --break-system-packages   # opencv/numpy/pillow: core/pools/source_probe.py (sample check)
          # same JS runtime as daily-create.yml (deno)
          curl -fsSL https://deno.land/install.sh | sh && echo "$HOME/.deno/bin" >> $GITHUB_PATH && export PATH="$HOME/.deno/bin:$PATH"
          mkdir -p ~/.config/yt-dlp && echo '--js-runtimes deno' > ~/.config/yt-dlp/config   # also covers core/pools/source_probe.py
          deno --version | head -1; yt-dlp --version
          npm ci || npm install
          if [ -n "$YOUTUBE_COOKIES" ]; then printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt; fi
      - name: YouTube check (yt-dlp + JS solver + cookies)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          if [ -f /tmp/yt_cookies.txt ]; then
            echo "cookies: $(wc -c < /tmp/yt_cookies.txt) bytes, $(wc -l < /tmp/yt_cookies.txt) lines, $(awk -F'\t' 'NF>=7' /tmp/yt_cookies.txt | wc -l) tab-separated rows, $(grep -c 'youtube.com' /tmp/yt_cookies.txt) youtube rows, header: $(head -1 /tmp/yt_cookies.txt | cut -c1-40)"
            echo "cookie names: $(awk -F'\t' 'NF>=7 && $1 !~ /^#/ {print $6}' /tmp/yt_cookies.txt | sort -u | tr '\n' ' ' | cut -c1-300)"
          else echo 'no cookies file'; fi
          cp /tmp/yt_cookies.txt /tmp/jar.txt 2>/dev/null
          python3 -m yt_dlp --ignore-config --no-warnings --force-ipv4 --retries 2 --js-runtimes deno --cookies /tmp/jar.txt --skip-download --ignore-errors --print "%(id)s h=%(height)s views=%(view_count)s %(title).50s" 'ytsearch2:BABYMONSTER SHEESH official' 2>&1 | cut -c1-200 | head -8
      - name: Run the gates
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then node scripts/song-topup.js --dry-run; else node scripts/song-topup.js; fi
      - name: Commit the new songs + the monthly report
        if: steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add config/song-candidates.json memory/song-topup-*.json 2>/dev/null || true
          git add memory/anilist-cache.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Song list top-up $(date +%F)"
          for i in 1 2 3; do git -c rebase.autoStash=true pull --rebase -X theirs origin main && git push && break; sleep 5; done
