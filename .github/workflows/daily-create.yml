name: 🌅 Daily Shorts Creation

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        type: boolean
        default: false

      skip_boost:
        description: 'Skip view boosting'
        type: boolean
        default: false

env:
  # Keep for your Node/OpenRouter scripts
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

  GH_PAT: ${{ secrets.GH_PAT }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

  CHANNEL_NAME: "Mr. WorldWideWebster"

  BOOST_ENABLED: ${{ github.event.inputs.skip_boost == 'true' && 'false' || 'true' }}
  BOOST_MAX_VIEWS: 100

jobs:
  create-shorts:

    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT || github.token }}
        fetch-depth: 0


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |

        sudo apt-get update -qq

        sudo apt-get install -y \
          ffmpeg \
          yt-dlp \
          curl \
          jq

        sudo apt-get install -y chromium || \
        sudo apt-get install -y chromium-browser || true

        python3 -m pip install -U \
          edge-tts \
          yt-dlp \
          --break-system-packages

        npm ci || npm install


    - name: Install Ollama
      run: |

        curl -fsSL https://ollama.com/install.sh | sh

        ollama serve > ollama.log 2>&1 &

        sleep 15

        ollama --version


    - name: Download Hermes model
      run: |

        echo "Downloading model..."

        ollama pull gemma3:4b

        ollama list


    - name: Setup Docker
      run: docker --version


    - name: Start Camofox
      run: |

        cd /tmp

        git clone https://github.com/jo-inc/camofox-browser.git

        cd camofox-browser

        make down || true
        make build

        IMAGE=$(docker images \
        --format "{{.Repository}}:{{.Tag}}" \
        | grep '^camofox-browser:' \
        | head -1)

        if [ -z "$IMAGE" ]; then
          echo "No image built"
          exit 1
        fi

        docker run -d \
          --name camofox-browser \
          -p 9377:9377 \
          -p 6080:6080 \
          -e CAMOFOX_PORT=9377 \
          "$IMAGE"

        for i in {1..30}; do

          if curl -fs http://localhost:9377/health >/dev/null
          then
            echo "Camofox ready"
            exit 0
          fi

          sleep 3

        done

        docker logs camofox-browser


    - name: Install Hermes
      run: |

        curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

        mkdir -p ~/.hermes

        cat > ~/.hermes/.env <<EOF
        CAMOFOX_URL=http://localhost:9377
        OLLAMA_HOST=http://localhost:11434
        HERMES_VERBOSE=1
        EOF


        cat > ~/.hermes/config.yaml <<EOF

        llm:
          provider: ollama
          model: gemma3:4b
          base_url: http://localhost:11434/v1
          max_tokens: 1200
          temperature: 0.7

        completion:
          max_tokens: 800

        agent:
          max_turns: 5

        memory:
          memory_enabled: true
          user_profile_enabled: true

          memory_char_limit: 2200
          user_char_limit: 1200

        compression:
          enabled: true

        tool_output:
          max_bytes: 15000
          max_lines: 300
          max_line_length: 500

        file_read_max_chars: 15000

        browser:
          camofox:
            managed_persistence: true

        tools:
          browser: true
          terminal: true
          web: true
          skills: true

        EOF

        hermes status || true


    - name: Restore memory
      run: |

        mkdir -p ~/.hermes
        mkdir -p memory

        cp -r hermes-memory/* ~/.hermes/ 2>/dev/null || true

        [ -f memory/channel-memory.json ] || \
        echo '{"initialRun":true}' > memory/channel-memory.json

        [ -f memory/trending-log.json ] || \
        echo '{"trends":[]}' > memory/trending-log.json

        [ -f memory/content-history.json ] || \
        echo '{"videos":[]}' > memory/content-history.json


    - name: Verify TTS
      run: |

        python3 -m edge_tts \
          --text "Testing voice generation" \
          --write-media test.mp3

        ls -lh test.mp3


    - name: Setup YouTube cookies
      run: |

        if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]
        then
          echo "${{ secrets.YOUTUBE_COOKIES }}" \
          > /tmp/youtube_cookies.txt
        fi


    - name: Run content pipeline
      env:
        OLLAMA_URL: http://localhost:11434
        OLLAMA_MODEL: gemma3:4b
      run: |

        node core/github-action-runner.js --mode daily


    - name: Trim memory
      run: |

        node -e "

        const fs=require('fs');

        for(const file of [
          'memory/trending-log.json',
          'memory/content-history.json'
        ]){

          if(!fs.existsSync(file))
            continue;

          let d=JSON.parse(fs.readFileSync(file));

          if(d.trends)
            d.trends=d.trends.slice(-20);

          if(d.videos)
            d.videos=d.videos.slice(-50);

          fs.writeFileSync(
            file,
            JSON.stringify(d,null,2)
          );

        }
        "


    - name: Save memory
      run: |

        mkdir -p hermes-memory

        cp -r ~/.hermes/* hermes-memory/ || true

        git config user.name "Mr. WorldWideWebster Bot"
        git config user.email "bot@worldwidewebster.com"

        git add memory/
        git add hermes-memory/
        git add output/scripts/ 2>/dev/null || true

        if ! git diff --staged --quiet
        then
          git commit -m "📊 Memory update $(date +%F)"
          git push
        fi


    - name: Cleanup
      if: always()
      run: |

        pkill ollama || true

        docker stop camofox-browser || true
        docker rm camofox-browser || true

        rm -rf ~/.hermes/sessions || true
        rm -rf ~/.hermes/checkpoints || true
        rm -rf output/temp || true

        echo "Cleanup complete"
