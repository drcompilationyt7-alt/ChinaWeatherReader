name: 🌅 Daily Shorts Creation

on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM daily
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode (skip uploads)'
        type: boolean
        default: false
      skip_boost:
        description: 'Skip view boosting'
        type: boolean
        default: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  CHANNEL_NAME: "Mr. WorldWideWebster"
  GH_PAT: ${{ secrets.GH_PAT }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

  BOOST_ENABLED: ${{ github.event.inputs.skip_boost == 'true' && 'false' || 'true' }}
  BOOST_MAX_VIEWS: 100

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg yt-dlp

          sudo apt-get install -y chromium || \
          sudo apt-get install -y chromium-browser || true

          python3 -m pip install -U yt-dlp

          echo "✅ System dependencies installed"
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Setup Docker for Camofox
        run: |
          set -e

          docker --version
          echo "✅ Docker available"

      - name: Clone and start Camofox browser server
        run: |
          set -e

          cd /tmp

          git clone https://github.com/jo-inc/camofox-browser.git
          cd camofox-browser

          echo "🔨 Building Camofox Docker image..."
          make build

          echo "🚀 Starting Camofox container..."

          mkdir -p ~/.camofox-docker

          docker run -d \
            --name camofox-browser \
            --restart unless-stopped \
            -p 9377:9377 \
            -p 6080:6080 \
            -p 5901:5900 \
            -e CAMOFOX_PORT=9377 \
            -e ENABLE_VNC=1 \
            -e VNC_BIND=0.0.0.0 \
            -e VNC_RESOLUTION=1920x1080 \
            -e MAX_OLD_SPACE_SIZE=2048 \
            -v ~/.camofox-docker:/root/.camofox \
            camofox-browser:latest

          echo "⏳ Waiting for Camofox..."
          sleep 20

          curl -s http://localhost:9377/health || \
          echo "⚠️ Health check failed but continuing"

          echo "✅ Camofox started"
          echo "📺 VNC: http://localhost:6080"

      - name: Install Node dependencies
        run: |
          set -e

          npm ci --production || npm install
          echo "✅ Dependencies installed"

      - name: Install Hermes Agent
        run: |
          set -e

          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

          hermes config set OPENROUTER_API_KEY "${{ secrets.OPENROUTER_API_KEY }}"
          hermes config set OPENROUTER_MODEL "openrouter/owl-alpha"

          hermes config set DISCORD_BOT_TOKEN "${{ secrets.DISCORD_BOT_TOKEN }}"
          hermes config set DISCORD_CHANNEL_ID "${{ secrets.DISCORD_CHANNEL_ID }}"

          hermes config set YOUTUBE_CHANNEL "Mr. WorldWideWebster"

          echo "🦊 Configuring Camofox"

          mkdir -p ~/.hermes

          echo 'CAMOFOX_URL=http://localhost:9377' >> ~/.hermes/.env

          printf '%s\n' \
          'browser:' \
          '  camofox:' \
          '    managed_persistence: true' \
          > ~/.hermes/config.yaml

          echo "===== Hermes Config ====="
          cat ~/.hermes/config.yaml
          echo "========================="

          echo "✅ Hermes configured"

      - name: Install Python dependencies
        run: |
          set -e

          python3 -m pip install edge-tts

          python3 -m edge_tts --help | head -3

          echo "✅ Edge-TTS ready"

      - name: Restore Hermes memory
        run: |
          set -e

          echo "📂 Restoring memory"

          mkdir -p ~/.hermes

          if [ -d "hermes-memory" ]; then
            cp -r hermes-memory/* ~/.hermes/ || true
            echo "✅ Hermes memory restored"
          else
            echo "ℹ️ Starting fresh"
            mkdir -p hermes-memory
          fi

          mkdir -p memory

          [ -f memory/channel-memory.json ] || \
          echo '{"initialRun":true}' > memory/channel-memory.json

          [ -f memory/trending-log.json ] || \
          echo '{"trends":[]}' > memory/trending-log.json

          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" \
            > /tmp/youtube_cookies.txt

            export YOUTUBE_COOKIES_FILE=/tmp/youtube_cookies.txt

            echo "✅ YouTube cookies loaded"
          else
            echo "⚠️ No YouTube cookies configured"
          fi

      - name: Run daily creation pipeline
        id: create
        run: |
          set -e

          node core/github-action-runner.js --mode daily

          echo "status=completed" >> "$GITHUB_OUTPUT"

          echo "✅ Pipeline complete"

      - name: Save memory back to repo
        run: |
          set -e

          if [ -d ~/.hermes ]; then
            mkdir -p hermes-memory
            cp -r ~/.hermes/* hermes-memory/ || true
          fi

          git config user.name "Mr. WorldWideWebster Bot"
          git config user.email "bot@worldwidewebster.com"

          git add memory/
          git add hermes-memory/
          git add output/scripts/ 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "📊 Daily memory update: $(date +%Y-%m-%d)"
            git push

            echo "✅ Memory saved"
          else
            echo "ℹ️ No changes to save"
          fi

      - name: Cleanup temp files
        if: always()
        run: |
          rm -rf output/temp || true

          docker stop camofox-browser || true
          docker rm camofox-browser || true

          echo "🧹 Cleanup complete"
