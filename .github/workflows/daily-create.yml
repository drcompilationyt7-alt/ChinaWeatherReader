# 🌅 Mr. WorldWideWebster — Daily Content Creation
# Runs at 6 AM: Creates 2 clipped shorts + 1 "What is this...?" explainer
# Uploads all 3 to YouTube Shorts
# Boosts views with organic Puppeteer sessions
# Sends daily summary to Discord
# Total runtime: ~15-30 minutes (well within 6 hour limit)

name: 🌅 Daily Shorts Creation

on:
  schedule:
    - cron: '0 6 * * *'          # 6 AM daily
  workflow_dispatch:              # Manual trigger for testing
    inputs:
      debug:
        description: 'Run in debug mode (skip uploads)'
        type: boolean
        default: false
      skip_boost:
        description: 'Skip view boosting'
        type: boolean
        default: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  CHANNEL_NAME: Mr. WorldWideWebster
  GH_PAT: ${{ secrets.GH_PAT }}
  # YouTube cookies for bypassing bot detection (optional but recommended)
  # Export from your browser using: https://github.com/yt-dlp/yt-dlp/wiki/FAQ#how-do-i-pass-cookies-to-yt-dlp
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  BOOST_ENABLED: ${{ github.event.inputs.skip_boost == 'true' && 'false' || 'true' }}
  BOOST_MAX_VIEWS: 100

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max (GitHub limit is 6)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history for memory commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo apt-get install -y -qq yt-dlp
          sudo apt-get install -y -qq chromium-browser 2>/dev/null || true
          
          # Update yt-dlp to latest version (YouTube frequently changes their API)
          pip install -U yt-dlp 2>&1 | tail -3
          
          echo "✅ System deps installed (ffmpeg, yt-dlp, chromium)"
          echo "✅ yt-dlp updated to latest version"

      - name: Install Node.js dependencies
        run: |
          npm ci --production || npm install
          echo "✅ Dependencies installed"

      - name: Install Hermes Agent (official)
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          hermes config set OPENROUTER_API_KEY "${{ secrets.OPENROUTER_API_KEY }}"
          hermes config set OPENROUTER_MODEL "openrouter/owl-alpha"
          hermes config set DISCORD_BOT_TOKEN "${{ secrets.DISCORD_BOT_TOKEN }}"
          hermes config set DISCORD_CHANNEL_ID "${{ secrets.DISCORD_CHANNEL_ID }}"
          hermes config set YOUTUBE_CHANNEL "Mr. WorldWideWebster"
          echo "✅ Hermes Agent installed and configured with Discord + YouTube"

      - name: Install Python deps (Edge-TTS)
        run: |
          pip install edge-tts 2>&1
          python3 -m edge_tts --help | head -3
          echo "✅ Edge-TTS ready"

      - name: Restore Hermes CLI memory from repo
        run: |
          echo "📂 Restoring Hermes Agent persistent memory..."
          # Hermes CLI stores config in ~/.hermes — link it from repo for persistence
          mkdir -p ~/.hermes 2>/dev/null || true
          if [ -d "hermes-memory" ]; then
            cp -r hermes-memory/* ~/.hermes/ 2>/dev/null || true
            echo "✅ Hermes memory restored from repo"
          else
            echo "ℹ️ No existing Hermes memory found — starting fresh"
            mkdir -p hermes-memory
          fi
          # Also load channel memory
          cat memory/channel-memory.json 2>/dev/null || echo '{"initialRun":true}' > memory/channel-memory.json
          cat memory/trending-log.json 2>/dev/null || echo '{"trends":[]}' > memory/trending-log.json
          
          # Setup YouTube cookies if provided (for bypassing bot detection)
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" > /tmp/youtube_cookies.txt
            export YOUTUBE_COOKIES_FILE="/tmp/youtube_cookies.txt"
            echo "✅ YouTube cookies loaded for yt-dlp"
          else
            echo "⚠️ No YouTube cookies provided — may encounter bot detection"
          fi
          
          echo "✅ All memory loaded"

      - name: Run daily creation pipeline
        id: create
        run: |
          # Run the GitHub Actions runner — creates content, uploads, boosts, notifies Discord
          node core/github-action-runner.js --mode daily
          
          echo "status=completed" >> $GITHUB_OUTPUT
          echo "✅ Daily creation pipeline finished"

      - name: Save memory back to repo (persists across GH Action runs)
        run: |
          # Save Hermes CLI memory to repo so it survives container destruction
          if [ -d ~/.hermes ]; then
            mkdir -p hermes-memory
            cp -r ~/.hermes/* hermes-memory/ 2>/dev/null || true
            echo "✅ Hermes CLI memory saved"
          fi
          
          git config user.name "Mr. WorldWideWebster Bot"
          git config user.email "bot@worldwidewebster.com"
          git add memory/
          git add hermes-memory/
          git add output/scripts/ 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "📊 Daily memory update: $(date +%Y-%m-%d)"
            git push
            echo "✅ Memory saved to repo"
          else
            echo "ℹ️ No memory changes to commit"
          fi

      - name: Cleanup temp files
        if: always()
        run: |
          rm -rf output/temp 2>/dev/null || true
          echo "🧹 Cleanup done"
