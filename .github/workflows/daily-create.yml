name: Daily Shorts Creation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  SHADOWSOCKS_SERVER: ${{ secrets.SHADOWSOCKS_SERVER }}
  SHADOWSOCKS_KEY: ${{ secrets.SHADOWSOCKS_KEY }}

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip
          python3 -m pip install -U pip edge-tts yt-dlp yt-dlp-ejs --break-system-packages
          npm ci || npm install
          npm install axios

      - name: Write cookies file
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "Cookies: $(wc -l < /tmp/yt_cookies.txt) lines"
          else
            echo "WARNING: No YOUTUBE_COOKIES secret set"
          fi

      - name: Setup Shadowsocks proxy
        run: |
          if [ -z "$SHADOWSOCKS_SERVER" ] || [ -z "$SHADOWSOCKS_KEY" ]; then
            echo "No Shadowsocks credentials"
            echo "proxy_ready=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Installing shadowsocks-libev..."
          sudo apt-get install -y shadowsocks-libev 2>/dev/null
          sudo systemctl disable shadowsocks-libev --now || true

          # Write config from secrets
          sudo tee /etc/shadowsocks-libev/oracle.json > /dev/null <<SSEOF
          {
            "server": "${SHADOWSOCKS_SERVER}",
            "server_port": 443,
            "method": "chacha20-ietf-poly1305",
            "password": "${SHADOWSOCKS_KEY}",
            "local_address": "127.0.0.1",
            "local_port": 1080,
            "mode": "tcp_and_udp"
          }
SSEOF

          sudo systemctl enable shadowsocks-libev-local@oracle --now
          sleep 3

          if sudo systemctl is-active shadowsocks-libev-local@oracle; then
            echo "Shadowsocks proxy running on 127.0.0.1:1080"
            echo "proxy_ready=true" >> $GITHUB_OUTPUT
            echo "YT_PROXY=socks5://127.0.0.1:1080" >> $GITHUB_ENV
          else
            echo "Shadowsocks failed"
            echo "proxy_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Environment diagnostics
        run: |
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"
          echo "FFmpeg: $(ffmpeg -version 2>&1 | head -1)"
          python3 -c "import yt_dlp; print(f'yt-dlp: {yt_dlp.version.__version__}')" 2>/dev/null || echo "yt-dlp: not found"
          python3 -c "import yt_dlp_getpot_wpc" 2>/dev/null && echo "  wpc: installed" || echo "  wpc: not found"
          echo "Proxy test: $(curl -s --connect-timeout 5 --proxy "${YT_PROXY:-}" https://ifconfig.me 2>/dev/null || echo 'unreachable')"

      - name: Restore memory
        run: |
          mkdir -p memory
          if [ -d "hermes-memory" ]; then cp -r hermes-memory/* memory/ 2>/dev/null || true; fi

      - name: Run pipeline
        run: node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add memory/ output/ && git diff --staged --quiet || (git commit -m "Update $(date +%F)" && git push || true)

      - name: Cleanup
        if: always()
        run: |
          sudo systemctl stop shadowsocks-libev-local@oracle 2>/dev/null || true
          rm -rf output/temp 2>/dev/null || true