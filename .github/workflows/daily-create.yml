name: 🌅 Daily Shorts Creation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Run in debug mode"
        type: boolean
        default: false
      skip_boost:
        description: "Skip view boosting"
        type: boolean
        default: false

env:
  # Node-side scripts may still need this, but Hermes will NOT use it
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

  GH_PAT: ${{ secrets.GH_PAT }}

  CHANNEL_NAME: "Mr. WorldWideWebster"

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            yt-dlp \
            jq \
            curl

          sudo apt-get install -y chromium || \
          sudo apt-get install -y chromium-browser || true

          python3 -m pip install -U \
            edge-tts \
            yt-dlp \
            playwright \
            --break-system-packages

          npm ci || npm install
          npm install -g agent-browser

          # Install puppeteer dependencies for Camofox integration
          npx playwright install chromium

      - name: Install Ollama (with large context)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Force Ollama to use a 65k context window for all models
          export OLLAMA_CONTEXT_LENGTH=65536
          ollama serve > ollama.log 2>&1 &
          sleep 15
          curl http://127.0.0.1:11434/api/tags

      - name: Pull model
        run: |
          ollama pull llama3.2:3b
          ollama list

      - name: Start Camofox
        run: |
          docker pull ghcr.io/jo-inc/camofox-browser:latest
          docker run -d \
            --name camofox-browser \
            -p 9377:9377 \
            -p 9222:9222 \
            --add-host=www.youtube.com:142.250.185.206 \
            --add-host=www.bilibili.com:183.240.98.221 \
            --add-host=www.tiktok.com:161.117.252.103 \
            ghcr.io/jo-inc/camofox-browser:latest

          # Wait for Camofox to be ready
          READY=false
          for i in {1..30}; do
            if curl -fs http://localhost:9377/health >/dev/null; then
              READY=true
              break
            fi
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            docker ps -a
            docker logs camofox-browser || true
            exit 1
          fi
          
          # Verify WebSocket endpoint is available
          echo "Checking Camofox WebSocket endpoint..."
          for i in {1..10}; do
            if curl -fs http://localhost:9377/json/version >/dev/null; then
              echo "✅ Camofox WebSocket endpoint ready"
              curl -fs http://localhost:9377/json/version | head -c 200
              break
            fi
            sleep 2
          done
          
          # Also verify /json/list endpoint for Puppeteer compatibility
          echo ""
          echo "Checking Camofox /json/list endpoint..."
          for i in {1..5}; do
            if curl -fs http://localhost:9377/json/list >/dev/null; then
              echo "✅ Camofox /json/list endpoint ready"
              curl -fs http://localhost:9377/json/list | head -c 300
              break
            fi
            sleep 2
          done
          
          echo ""
          echo "Camofox ready"

      - name: Install Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

          mkdir -p ~/.hermes
          rm -f ~/.hermes/config.yaml ~/.hermes/.env ~/.hermes/auth.json

          cat > ~/.hermes/.env <<'EOF'
          CAMOFOX_URL=http://localhost:9377
          HERMES_VERBOSE=1
          EOF

          cat > ~/.hermes/config.yaml <<'EOF'
          model:
            provider: custom
            default: llama3.2:3b
            base_url: http://localhost:11434/v1
            api_key: ollama
            api_mode: chat_completions
            ollama_compatible: true
            context_length: 65536

          agent:
            max_turns: 4

          browser:
            provider: camofox
            camofox:
              url: http://localhost:9377
              managed_persistence: true

          toolsets:
            - web
            - terminal
            - skills
            - browser

          memory:
            enabled: true
            char_limit: 2000

          tools:
            browser: true
            terminal: true
            web: true
            skills: true
          EOF

          # Verify config files exist
          echo "===== CONFIG ====="
          cat ~/.hermes/config.yaml
          echo ""
          echo "===== .ENV ====="
          cat ~/.hermes/.env
          echo ""
          echo "===== HERMES STATUS ====="
          hermes status || true
          echo ""
          echo "===== TEST ====="
          timeout 180s hermes --yolo chat -q "Reply only OK" --toolsets "web,terminal,skills,browser"
          
          # Export HERMES_CONFIG explicitly for child processes
          echo "HERMES_CONFIG=$HOME/.hermes/config.yaml" >> $GITHUB_ENV
          echo "HERMES_ENV=$HOME/.hermes/.env" >> $GITHUB_ENV

      - name: Environment diagnostics
        run: |
          echo "=== ENVIRONMENT DIAGNOSTICS ==="
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"
          echo "Hermes: $(hermes --version 2>&1)"
          echo "yt-dlp: $(yt-dlp --version 2>&1)"
          echo "OpenRouter key length: ${#OPENROUTER_API_KEY}"
          echo "Camofox health: $(curl -fs http://localhost:9377/health 2>&1 || echo 'UNREACHABLE')"
          echo "Ollama status: $(curl -fs http://localhost:11434/api/tags 2>&1 | head -c 200 || echo 'UNREACHABLE')"

      - name: Restore memory
        run: |
          mkdir -p ~/.hermes
          mkdir -p memory
          shopt -s dotglob nullglob
          for item in hermes-memory/*; do
            base="$(basename "$item")"
            case "$base" in
              config.yaml|.env|auth.json) continue ;;
            esac
            cp -r "$item" ~/.hermes/
          done

      - name: Run content pipeline
        run: |
          # Unset cloud API keys so Hermes uses the local Ollama model
          # configured in ~/.hermes/config.yaml instead of OpenRouter
          unset OPENROUTER_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY
          node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |
          mkdir -p hermes-memory
          cp -r ~/.hermes/* hermes-memory/ || true

          git config user.name "Mr. WorldWideWebster Bot"
          git config user.email "bot@worldwidewebster.com"

          git add memory/ hermes-memory/

          if ! git diff --staged --quiet; then
            git commit -m "📊 Memory update $(date +%F)"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          pkill ollama || true
          docker stop camofox-browser || true
          docker rm camofox-browser || true
          rm -rf ~/.hermes/sessions || true
          rm -rf ~/.hermes/checkpoints || true
