name: Daily Shorts Creation (Gemini-First)

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Override country (optional)'
        required: false
      private:
        description: 'Upload as private (default: false)'
        required: false
        default: 'false'
      publishAt:
        description: 'Override publish time (ISO 8601)'
        required: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
  GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
  GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
  GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
  GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
  OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
  OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
  OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  PRIVATE: "true"
  PUBLISH_HOUR_UTC: "12"

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean old test data
        run: |
          rm -rf output/ memory/hermes-memory/
          mkdir -p output/clips output/assets/voiceovers output/assets/audio memory

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip libgl1 libglib2.0-0

      - name: Install Deno (JS runtime for yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python3 -m pip install -U pip
          python3 -m pip install edge-tts yt-dlp yt-dlp-ejs faster-whisper opencv-python-headless ultralytics scenedetect[opencv] transformers sentencepiece --break-system-packages

      - name: Install Node.js dependencies
        run: |
          npm ci || npm install
          npm install axios

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-base-${{ runner.os }}

      - name: Pre-download whisper model (with retries for HF rate limit)
        run: |
          RETRIES=0
          MAX_RETRIES=5
          until python3 -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8'); print('faster-whisper model ready')"; do
            RETRIES=$((RETRIES + 1))
            if [ $RETRIES -ge $MAX_RETRIES ]; then
              echo "whisper download failed after $MAX_RETRIES retries"
              exit 1
            fi
            WAIT=$((RETRIES * 30))
            echo "Rate limited by HF, retrying in ${WAIT}s (attempt $RETRIES/$MAX_RETRIES)..."
            sleep $WAIT
          done

      - name: Write cookies file
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          fi

      - name: Set publishAt (8:00 AM EDT = 12:00 UTC)
        run: |
          if [ -n "${{ github.event.inputs.publishAt }}" ]; then
            echo "PUBLISH_AT=${{ github.event.inputs.publishAt }}" >> $GITHUB_ENV
          else
            echo "PUBLISH_AT=$(date -u -d 'today ${PUBLISH_HOUR_UTC}:00:00' +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          fi

      - name: Run daily pipeline
        run: |
          COUNTRY_ARG=""
          if [ -n "${{ github.event.inputs.country }}" ]; then
            COUNTRY_ARG="--country ${{ github.event.inputs.country }}"
          fi
          PRIVATE_ARG=""
          if [ "${{ github.event.inputs.private }}" = "true" ] || [ "$PRIVATE" = "true" ]; then
            PRIVATE_ARG="--private"
          fi
          node core/github-action-runner.js --mode daily $COUNTRY_ARG $PRIVATE_ARG --publish-at "$PUBLISH_AT"

      - name: Save memory
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add memory/channel-memory.json config/trend-banks/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update $(date +%F)" && git push || true)

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/yt_cookies.txt 2>/dev/null || true