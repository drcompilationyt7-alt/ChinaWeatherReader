    - name: Install Hermes
      run: |
        curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

        mkdir -p ~/.hermes

        # Remove auto-generated configs
        rm -f ~/.hermes/config.yaml
        rm -f ~/.hermes/.env
        rm -f ~/.hermes/auth.json

        # Force Ollama only
        cat > ~/.hermes/.env <<EOF
        CAMOFOX_URL=http://localhost:9377
        OLLAMA_HOST=http://127.0.0.1:11434
        HERMES_VERBOSE=1
        EOF

        # Force Hermes config
        cat > ~/.hermes/config.yaml <<EOF
        llm:
          provider: ollama
          model: qwen3:8b
          endpoint: http://127.0.0.1:11434
          temperature: 0.7
          max_tokens: 1000

        completion:
          max_tokens: 800

        agent:
          max_turns: 4

        browser:
          camofox:
            managed_persistence: true

        memory:
          memory_enabled: true
          memory_char_limit: 2000

        tools:
          browser: true
          terminal: true
          web: true
          skills: true
        EOF

        # Hard-force environment variables so Hermes
        # cannot silently switch back to OpenRouter

        export OLLAMA_HOST=http://127.0.0.1:11434
        export HERMES_LLM_PROVIDER=ollama
        export HERMES_MODEL=qwen3:8b

        unset OPENROUTER_API_KEY
        unset OPENAI_API_KEY
        unset ANTHROPIC_API_KEY

        echo "===== HERMES CONFIG ====="
        cat ~/.hermes/config.yaml

        echo "===== HERMES STATUS ====="
        hermes status || true

        echo "===== OLLAMA TEST ====="
        curl http://127.0.0.1:11434/api/tags

        echo "===== HERMES TEST ====="
        hermes -z "Reply only with OK"
