name: Daily Shorts Creation (Gemini-First)

on:
  # Zero Yen Otaku: one meme short a day, published at 12:00 UTC. The render starts ~9 h early
  # (GitHub can start scheduled runs late); 07:47 and the external 06:22 trigger are backups that
  # do nothing once today's short is up.
  schedule:
    - cron: '47 2 * * *'
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'Override country (optional, clips mode only)'
        required: false
      private:
        description: 'Upload as private (default: false)'
        required: false
        default: 'false'
      publishAt:
        description: 'Override publish time (ISO 8601)'
        required: false
      mode:
        description: 'meme (default: acapella meme shorts) or pause (no upload)'
        required: false
        default: ''
      dry_run:
        description: 'Render only, attach the mp4s to the run, upload nothing (quiz and meme modes)'
        required: false
        default: 'false'
      type:
        description: 'Meme mode: force the edit type (sound / slowmo / ranking / stem; empty = daily rotation). stem stays the fallback'
        required: false
        default: ''
      newtype_args:
        description: 'Extra vibe_edit.py args for a sound / slowmo test (e.g. "--song s_kick_back --seed 41")'
        required: false
        default: ''
      ranking_topic:
        description: 'type=ranking: the topic key (core/edit/refs/ranking-topics.json); empty = the weekly rotation'
        required: false
        default: ''

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
  GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
  GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
  GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
  GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
  OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
  OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
  OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  PRIVATE: "true"
  PUBLISH_HOUR_UTC: "12"
  # pause = no upload; meme = "<song> acapella" meme shorts (this channel's new
  # format, switch the default to 'meme' once the samples are approved);
  # quiz = World Quiz shorts; daily = the old clip re-upload pipeline
  CONTENT_MODE: ${{ github.event.inputs.mode || 'meme' }}
  WATERMARK: '@zeroyenotaku'
  YT_COOKIES: /tmp/yt_cookies.txt
  MEME_PYTHON: python3
  # quiz shorts made by this run, scheduled QUIZ_SPACING_HOURS apart from PUBLISH_HOUR_UTC
  QUIZ_COUNT: "1"
  QUIZ_SPACING_HOURS: "4"
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  # Daily rotation (pipeline/daily-rotation.js): the one short is a stem, sound or slowmo edit, weighted random, never
  # the same type twice in a row; a new type with an empty pool or a failed render falls back to stem.
  # Override the weights with the repository variable DAILY_TYPE_WEIGHTS (e.g. "stem:2,sound:1,slowmo:1"; 0 = off),
  # DAILY_ROTATION=off goes back to stem only.
  # 2026-10-17 owner: SOUND EDIT approved (sound_11b) -> repo variables DAILY_ROTATION=on, DAILY_TYPE_WEIGHTS=stem:1,sound:1,slowmo:0.
  # The sound render settings (sound_11b: beat remake, pinned hits, rotated layout + hint, no shake) are in pipeline/newtype-pipeline.js SOUND_ENV.
  DAILY_ROTATION: ${{ (github.event.inputs.type == 'sound' || github.event.inputs.type == 'slowmo' || github.event.inputs.type == 'ranking') && 'on' || vars.DAILY_ROTATION || 'off' }}
  DAILY_TYPE_WEIGHTS: ${{ vars.DAILY_TYPE_WEIGHTS || 'stem:1,sound:1,slowmo:0' }}
  # 2026-10-25 RANKING / list compilation (pipeline/newtype-pipeline.js runRanking): WEEKLY. On RANKING_WEEKDAY (UTC, 0 = Sunday,
  # default 6 = Saturday) it replaces that day's type when DAILY_TYPE_WEIGHTS has ranking:1 (default ranking:0 = OFF until the
  # owner approves the first CI-built one) and a topic has reviewed segments for every revealed entry; stem stays the fallback.
  RANKING_WEEKDAY: ${{ vars.RANKING_WEEKDAY || '6' }}
  RANKING_MIN_GAP_DAYS: ${{ vars.RANKING_MIN_GAP_DAYS || '6' }}
  RANKING_TOPIC: ${{ github.event.inputs.ranking_topic || '' }}
  DAILY_FORCE_TYPE: ${{ github.event.inputs.type || '' }}
  NEWTYPE_CLI_ARGS: ${{ github.event.inputs.newtype_args || '' }}
  # sound short: ~5-15 min on the 4-core runner (CPU, libx264); the cap leaves room for a cold model cache
  NEWTYPE_TIMEOUT_MIN: ${{ vars.NEWTYPE_TIMEOUT_MIN || '60' }}
  # 2026-10-23 (owner: "if the github when creating the slow mo edit is not good we have to fix it, we must publish a video every
  # day"): the judged repair loop (pipeline/newtype-pipeline.js runNewType) - at most NEWTYPE_MAX_ATTEMPTS renders within
  # NEWTYPE_BUDGET_MIN, no new attempt after NEWTYPE_DEADLINE_UTC on scheduled runs (the 02:47 run then still has the stem
  # fallback + upload hours before PUBLISH_HOUR_UTC 12:00); a fallback writes the job summary + memory/newtype-fallback.json
  # and opens an issue
  NEWTYPE_MAX_ATTEMPTS: ${{ vars.NEWTYPE_MAX_ATTEMPTS || '5' }}
  NEWTYPE_BUDGET_MIN: ${{ vars.NEWTYPE_BUDGET_MIN || '210' }}
  NEWTYPE_DEADLINE_UTC: ${{ vars.NEWTYPE_DEADLINE_UTC || '08:30' }}
  # Long versions of the sound / slowmo shorts (pipeline/longform-queue.js): rendered with the short, parked in a release
  # asset, uploaded 7 days after the short. LONG_ENABLED=off disables; the cadence is capped (see the queue header).
  LONG_ENABLED: ${{ vars.LONG_ENABLED || 'off' }}
  LONG_MIN_GAP_DAYS: ${{ vars.LONG_MIN_GAP_DAYS || '3' }}
  LONG_MAX_PER_WEEK: ${{ vars.LONG_MAX_PER_WEEK || '3' }}
  LONG_PUBLISH_HOUR_UTC: ${{ vars.LONG_PUBLISH_HOUR_UTC || '16' }}
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
  EDIT_POOL_DIR: output/edit-pools

# one daily run at a time (2026-10-23): a repair loop can run for hours; the 07:47 backup waits for it and then sees the
# day's upload in meme-history instead of rendering a second short
concurrency:
  group: daily-create
  cancel-in-progress: false

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: One short a day
        if: env.CONTENT_MODE == 'meme' && github.event.inputs.dry_run != 'true'
        run: |
          if node -e "const h=require('./memory/meme-history.json'); const d=new Date().toISOString().slice(0,10); process.exit((h.uploads||[]).some(u=>String(u.postedAt||'').startsWith(d))?0:1)" 2>/dev/null; then
            echo "Today's meme short is already uploaded; nothing to do."
            echo "CONTENT_MODE=pause" >> $GITHUB_ENV
          fi
          # 2026-10-21: a prebuilt video (memory/prebuilt-queue.json, upload-prebuilt.yml) owns its date, done or not, so a late
          # prebuilt cron never races this run; only the last daily run (07:47, UTC hour >= 7) posts the normal short as the
          # fallback when today's prebuilt is still not done. FAKE_TODAY / FAKE_HOUR = tests.
          PB=$(node -e "const fs=require('fs');let q={items:[]};try{q=JSON.parse(fs.readFileSync('memory/prebuilt-queue.json','utf8'))}catch(e){};const d=process.env.FAKE_TODAY||new Date().toISOString().slice(0,10);const h=Number(process.env.FAKE_HOUR||new Date().getUTCHours());const e=(q.items||[]).find(x=>x.date===d);console.log(!e?'none':e.done?'done':h>=7?'fallback':'wait')" 2>/dev/null || echo none)
          case "$PB" in
            done|wait) echo "Today belongs to a prebuilt video ($PB): the daily run skips."; echo "CONTENT_MODE=pause" >> $GITHUB_ENV ;;
            fallback) echo "::warning::Today's prebuilt video is still not posted at the last daily run: posting the normal daily short." ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean old test data
        run: |
          rm -rf output/ memory/hermes-memory/
          mkdir -p output/clips output/quiz output/assets/voiceovers output/assets/audio memory

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip libgl1 libglib2.0-0

      - name: Install Ollama and pull fallback models (Gemma 4, etc.)
        if: env.CONTENT_MODE == 'daily'
        run: |
          # Install Ollama for local LLM fallback (title/metadata generation)
          curl -fsSL https://ollama.com/install.sh | sh
          # Wait for Ollama to start
          for i in $(seq 1 10); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama started successfully"
              break
            fi
            echo "Waiting for Ollama to start... ($i/10)"
            sleep 3
          done
          # Pull models in order of preference (gemma4 first, then fallbacks)
          # gemma4 is the primary fallback for metadata generation
          for model in gemma4:latest llama3.2:latest phi4:latest; do
            echo "Pulling Ollama model: $model ..."
            if ollama pull "$model" 2>&1; then
              echo "Successfully pulled $model"
              break
            else
              echo "Failed to pull $model, trying next..."
            fi
          done
          echo "Ollama models ready"

      - name: Install Deno (JS runtime for yt-dlp)
        if: env.CONTENT_MODE == 'daily' || env.CONTENT_MODE == 'meme'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH

      - name: Install Python dependencies (meme)
        if: env.CONTENT_MODE == 'meme'
        run: |
          python3 -m pip install -U pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu --break-system-packages
          python3 -m pip install demucs librosa yt-dlp yt-dlp-ejs opencv-python-headless numpy pillow transformers sentencepiece protobuf --break-system-packages

      - name: Install sound / slow-mo edit extras (only when the rotation is switched on)
        if: env.CONTENT_MODE == 'meme' && env.DAILY_ROTATION != 'off'
        run: |
          # torchaudio from the same CPU index as torch (demucs pulls torchaudio; a PyPI one would not match), SigLIP/transformers are above
          python3 -m pip install torchaudio --index-url https://download.pytorch.org/whl/cpu --break-system-packages
          # librosa pinned to the version the approved sound_11b was rendered with (0.11.0); psutil = IDLE priority / RAM checks
          python3 -m pip install "librosa==0.11.0" scipy onnxruntime psutil soundfile --break-system-packages
          # slow-mo (2026-10-20 go-live): lyric alignment + judge_slowmo words (faster-whisper base / medium), its evidence plots
          # (matplotlib); demucs (vocal stem for the wave cuts + the judge) is installed above
          python3 -m pip install faster-whisper matplotlib --break-system-packages
          python3 -c "import librosa, scipy, cv2, torch, torchaudio, transformers, onnxruntime, psutil, soundfile, demucs, faster_whisper, matplotlib; print('sound / slow-mo deps ok', librosa.__version__, torch.__version__)"

      - name: Cache meme models (Demucs, SigLIP, anime face / nudity filters)
        if: env.CONTENT_MODE == 'meme'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/clip_finder
          # v2 = also the SigLIP weights and the anime-face onnx of the sound edit; v3 = + the slow-mo models (faster-whisper
          # base / medium, wav2vec2, htdemucs); the stem-only setup keeps its v1 cache
          # v4 (2026-10-23) = + wav2vec2 lv60k (the slow-mo lyric ensemble + the judge's per-word lyric check)
          key: meme-models-${{ env.DAILY_ROTATION == 'off' && 'v1' || 'v4' }}
          restore-keys: |
            meme-models-${{ env.DAILY_ROTATION == 'off' && 'v1' || 'v3' }}

      - name: Warm the slow-mo / sound judge models (from the cache; downloads retried, never fails the day)
        if: env.CONTENT_MODE == 'meme' && env.DAILY_ROTATION != 'off'
        continue-on-error: true
        run: |
          # pre-flight (2026-10-23): every model the renders and the judges load, so a missing model fails here (and is
          # retried) instead of late inside a render; the stem edit does not need them
          for i in 1 2 3; do
            if python3 core/edit/judge_repair.py --warm-models; then break; fi
            echo "model warm-up attempt $i failed; retrying"; sleep 30
          done

      - name: Install Python dependencies (quiz)
        if: env.CONTENT_MODE == 'quiz' || env.CONTENT_MODE == 'pause'
        run: |
          python3 -m pip install -U pip
          python3 -m pip install pillow numpy edge-tts --break-system-packages

      - name: Install Python dependencies
        if: env.CONTENT_MODE == 'daily'
        run: |
          python3 -m pip install -U pip
          python3 -m pip install edge-tts yt-dlp yt-dlp-ejs faster-whisper opencv-python-headless ultralytics scenedetect[opencv] transformers sentencepiece sentence-transformers mabwiser river dspy --break-system-packages

      - name: Install Node.js dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
        run: |
          npm ci || npm install
          npm install axios

      - name: Install Gemini CLI
        if: env.CONTENT_MODE == 'daily'
        run: npm install -g @google/gemini-cli

      - name: Cache whisper model
        if: env.CONTENT_MODE == 'daily'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-v2-${{ runner.os }}

      - name: Pre-download whisper model (with retries for HF rate limit)
        if: env.CONTENT_MODE == 'daily'
        run: |
          RETRIES=0
          MAX_RETRIES=5
          until python3 -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8'); print('faster-whisper model ready')"; do
            RETRIES=$((RETRIES + 1))
            if [ $RETRIES -ge $MAX_RETRIES ]; then
              echo "whisper download failed after $MAX_RETRIES retries"
              exit 1
            fi
            WAIT=$((RETRIES * 30))
            echo "Rate limited by HF, retrying in ${WAIT}s (attempt $RETRIES/$MAX_RETRIES)..."
            sleep $WAIT
          done

      - name: Pre-download title embedding model (self-learning)
        if: env.CONTENT_MODE == 'daily'
        run: |
          python3 -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2', device='cpu'); print('MiniLM ready')" || echo "MiniLM unavailable - title ranking falls back to char n-grams"
      - name: Write cookies file
        if: env.CONTENT_MODE == 'daily' || env.CONTENT_MODE == 'meme'
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          fi

      - name: Set publishAt (8:00 AM EDT = 12:00 UTC)
        run: |
          if [ -n "${{ github.event.inputs.publishAt }}" ]; then
            echo "PUBLISH_AT=${{ github.event.inputs.publishAt }}" >> $GITHUB_ENV
          else
            echo "PUBLISH_AT=$(date -u -d "today ${PUBLISH_HOUR_UTC}:00:00" +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          fi

      - name: Fetch the sound / slow-mo pools (release edit-pools; a failure only means a stem edit today)
        if: env.CONTENT_MODE == 'meme' && env.DAILY_ROTATION != 'off'
        continue-on-error: true
        run: node scripts/edit-pools-store.js pull

      - name: Run daily pipeline
        if: env.CONTENT_MODE != 'pause'
        run: |
          COUNTRY_ARG=""
          if [ -n "${{ github.event.inputs.country }}" ]; then
            COUNTRY_ARG="--country ${{ github.event.inputs.country }}"
          fi
          PRIVATE_ARG=""
          if [ "${{ github.event.inputs.private }}" = "true" ] || [ "$PRIVATE" = "true" ]; then
            PRIVATE_ARG="--private"
          fi
          if [ "$CONTENT_MODE" = "meme" ]; then
            node core/github-action-runner.js --mode meme --count 1 $PRIVATE_ARG --publish-at "$PUBLISH_AT"
          else
            echo "Mode $CONTENT_MODE is retired on this channel (the old re-upload pipelines); nothing to do."
          fi

      - name: Long-form queue (upload the long version that is due, at most one)
        # runs on every start (also when today's short was already up), is idempotent and respects the cadence caps
        if: always() && github.event.inputs.dry_run != 'true' && env.LONG_ENABLED != 'off'
        continue-on-error: true
        run: node core/github-action-runner.js --mode longform

      - name: Keep renders (every short, uploaded or not, for review)
        if: always() && env.CONTENT_MODE != 'pause'
        uses: actions/upload-artifact@v4
        with:
          name: renders
          if-no-files-found: ignore
          path: |
            output/quiz/*.mp4
            output/meme/*.mp4
            output/meme/work-*/*.mp4
            output/meme/work-*/result.json
            output/meme/work-*/work-*/short/plan.json
            output/meme/work-*/work-*/short/*.plan.json
            output/meme/work-*/judge/*.json
            output/meme/work-*/judge/*.md
            output/meme/work-*/judge/*.jpg
            output/meme/work-*/judge/*.png
            output/meme/work-*/repair*.json
            output/meme/work-ranking-*/*.txt
          retention-days: 7

      - name: Save memory
        if: always()
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          # add only files that exist: one missing path makes `git add` stage nothing
          for f in memory/channel-memory.json memory/type1-channel-memory.json memory/posted-videos.json \
                   memory/performance-stats.json memory/performance-insights.json memory/quiz-history.json \
                   memory/playlists.json memory/meme-history.json memory/river-views-model.pkl memory/river-seen.json \
                   memory/dspy-title-program.json memory/dspy-title-status.json config/channel-pool.json config/trend-banks \
                   memory/experiments.jsonl memory/outcomes.json memory/metadata-choices.jsonl memory/metadata-arms.json \
                   memory/yt-suggest-cache.json memory/longform-queue.json memory/edit-pool-used.json \
                   memory/newtype-repairs.jsonl memory/newtype-fallback.json \
                   core/edit/assets/sound-music-pool.json core/edit/assets/slowmo-music-pool.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update $(date +%F)"
          for i in 1 2 3; do
            git -c rebase.autoStash=true pull --rebase -X theirs origin main && git push && break
            sleep 5
          done

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/yt_cookies.txt 2>/dev/null || true
