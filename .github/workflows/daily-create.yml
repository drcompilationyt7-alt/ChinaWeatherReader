name: Daily Shorts Creation

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          python3 -m pip install -U pip edge-tts yt-dlp yt-dlp-ejs faster-whisper --break-system-packages
          npm ci || npm install
          npm install axios

      - name: Pre-download whisper model
        run: python3 -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8'); print('faster-whisper model ready')"

      - name: Install Ollama + pull local model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          sleep 10
          ollama pull llama3.2:3b
          echo "OLLAMA_HOST=http://localhost:11434" >> $GITHUB_ENV

      - name: Install Hermes CLI
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          mkdir -p ~/.hermes
          cat > ~/.hermes/config.yaml <<'EOF'
          model:
            provider: custom
            default: llama3.2:3b
            base_url: http://localhost:11434/v1
            api_key: ollama
            api_mode: chat_completions
            ollama_compatible: true
            context_length: 65536
          agent:
            max_turns: 4
          toolsets:
            - web
            - terminal
            - skills
          memory:
            enabled: true
            char_limit: 2000
          EOF
          hermes status || true
          echo "HERMES_CONFIG=$HOME/.hermes/config.yaml" >> $GITHUB_ENV

      - name: Write cookies file
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          fi

      - name: Restore Hermes memory
        run: |
          mkdir -p memory hermes-memory ~/.hermes
          if [ -d "hermes-memory" ]; then cp -r hermes-memory/* ~/.hermes/ 2>/dev/null || true; fi

      - name: Run pipeline
        run: |
          # Pipeline uses Hermes CLI via hermes-cli-wrapper.js for evaluation + memory
          node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |
          cp -r ~/.hermes/* hermes-memory/ 2>/dev/null || true
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add memory/ hermes-memory/ output/ && git diff --staged --quiet || (git commit -m "Update $(date +%F)" && git push || true)

      - name: Cleanup
        if: always()
        run: pkill ollama 2>/dev/null || true