name: 🌅 Daily Shorts Creation

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        type: boolean
        default: false

      skip_boost:
        description: 'Skip view boosting'
        type: boolean
        default: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

  GH_PAT: ${{ secrets.GH_PAT }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

  CHANNEL_NAME: "Mr. WorldWideWebster"

  BOOST_ENABLED: ${{ github.event.inputs.skip_boost == 'true' && 'false' || 'true' }}
  BOOST_MAX_VIEWS: 100

jobs:
  create-shorts:

    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT || github.token }}
        fetch-depth: 0


    - uses: actions/setup-node@v4
      with:
        node-version: 20


    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install system packages
      run: |

        sudo apt-get update -qq

        sudo apt-get install -y \
        ffmpeg \
        yt-dlp \
        curl \
        jq \
        chromium-browser

        python3 -m pip install -U \
        edge-tts \
        yt-dlp \
        --break-system-packages

        npm install


    - name: Install Ollama
      run: |

        curl -fsSL https://ollama.com/install.sh | sh

        ollama serve > ollama.log 2>&1 &

        sleep 10

        ollama --version


    - name: Download fallback model
      run: |

        echo "Downloading Gemma 3..."

        ollama pull gemma3:4b

        ollama list


    - name: Install Hermes
      run: |

        curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

        mkdir -p ~/.hermes

        hermes config set OPENROUTER_API_KEY "${{ secrets.OPENROUTER_API_KEY }}"
        hermes config set OPENROUTER_MODEL "openrouter/owl-alpha"

        cat > ~/.hermes/.env <<EOF
        CAMOFOX_URL=http://localhost:9377
        OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
        HERMES_VERBOSE=1
        EOF

        cat > ~/.hermes/config.yaml <<EOF

        llm:
          provider: openrouter
          model: openrouter/owl-alpha
          max_tokens: 1200

        completion:
          max_tokens: 800

        memory:
          memory_enabled: true
          memory_char_limit: 2000

        EOF


    - name: Restore memory
      run: |

        mkdir -p ~/.hermes
        mkdir -p memory

        cp -r hermes-memory/* ~/.hermes/ 2>/dev/null || true

        [ -f memory/channel-memory.json ] || \
        echo '{"initialRun":true}' > memory/channel-memory.json

        [ -f memory/trending-log.json ] || \
        echo '{"trends":[]}' > memory/trending-log.json

        [ -f memory/content-history.json ] || \
        echo '{"videos":[]}' > memory/content-history.json


    - name: Verify TTS
      run: |

        python3 -m edge_tts \
        --text "test" \
        --write-media test.mp3

        ls -lh test.mp3


    - name: Run pipeline
      env:

        OLLAMA_URL: http://localhost:11434
        OLLAMA_MODEL: gemma3:4b

      run: |

        node core/github-action-runner.js --mode daily


    - name: Save memory
      run: |

        mkdir -p hermes-memory

        cp -r ~/.hermes/* hermes-memory/ || true

        git config user.name "Mr. WorldWideWebster Bot"
        git config user.email "bot@worldwidewebster.com"

        git add memory/
        git add hermes-memory/

        if ! git diff --staged --quiet
        then
          git commit -m "📊 Memory update $(date +%F)"
          git push
        fi


    - name: Cleanup
      if: always()
      run: |

        pkill ollama || true

        rm -rf ~/.hermes/sessions || true
        rm -rf output/temp || true
