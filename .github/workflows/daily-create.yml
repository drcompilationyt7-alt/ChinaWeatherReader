name: Daily Shorts Creation

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          python3 -m pip install -U pip edge-tts yt-dlp yt-dlp-ejs faster-whisper --break-system-packages
          npm ci || npm install
          npm install axios

      - name: Pre-download whisper model
        run: python3 -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8'); print('faster-whisper model ready')"

      - name: Setup Shadowsocks
        id: ss
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "${{ secrets.SHADOWSOCKS_SERVER }}" ]; then echo "no ss"; exit 0; fi
          sudo apt-get install -y shadowsocks-libev 2>/dev/null
          sudo systemctl disable shadowsocks-libev --now || true
          sudo tee /etc/shadowsocks-libev/oracle.json > /dev/null <<'EOF'
          {"server":"${{ secrets.SHADOWSOCKS_SERVER }}","server_port":8388,"local_address":"127.0.0.1","local_port":1080,"password":"${{ secrets.SHADOWSOCKS_PASSWORD }}","timeout":300,"method":"chacha20-ietf-poly1305"}
          EOF
          sudo systemctl enable shadowsocks-libev-local@oracle --now
          sleep 3
          sudo systemctl is-active shadowsocks-libev-local@oracle && echo "YT_PROXY=socks5://127.0.0.1:1080" >> $GITHUB_ENV || true

      - name: Write cookies file
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "Cookies file created: $(wc -l < /tmp/yt_cookies.txt) lines"
          fi

      - name: Restore memory
        run: |
          mkdir -p memory
          if [ -d "hermes-memory" ]; then cp -r hermes-memory/* memory/ 2>/dev/null || true; fi

      - name: Run pipeline
        run: node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add memory/ output/ && git diff --staged --quiet || (git commit -m "Update $(date +%F)" && git push || true)

      - name: Cleanup
        if: always()
        run: sudo systemctl stop shadowsocks-libev-local@oracle 2>/dev/null || true