name: Daily Shorts Creation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip chromium-browser
          python3 -m pip install -U pip
          python3 -m pip install -U edge-tts yt-dlp yt-dlp-ejs playwright --break-system-packages
          
          # Install bgutil PO Token plugin + dependencies
          python3 -m pip install -U bgutil-ytdlp-pot-provider --break-system-packages
          python3 -m playwright install chromium --with-deps 2>/dev/null || true
          
          npm ci || npm install
          npm install axios

      - name: Setup Shadowsocks proxy
        id: ss
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "${{ secrets.SHADOWSOCKS_SERVER }}" ] || [ -z "${{ secrets.SHADOWSOCKS_PASSWORD }}" ]; then
            echo "proxy_ready=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          sudo apt-get install -y shadowsocks-libev
          sudo systemctl disable shadowsocks-libev --now || true
          sudo tee /etc/shadowsocks-libev/oracle.json > /dev/null <<SSEOF
          {"server":"${{ secrets.SHADOWSOCKS_SERVER }}","server_port":8388,"local_address":"127.0.0.1","local_port":1080,"password":"${{ secrets.SHADOWSOCKS_PASSWORD }}","timeout":300,"method":"chacha20-ietf-poly1305"}
          SSEOF
          sudo systemctl enable shadowsocks-libev-local@oracle --now
          sleep 3
          if sudo systemctl is-active shadowsocks-libev-local@oracle; then
            echo "YT_PROXY=socks5://127.0.0.1:1080" >> $GITHUB_ENV
            echo "proxy_ready=true" >> $GITHUB_OUTPUT
          else
            echo "proxy_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Check proxy
        run: |
          echo "Proxy: ${YT_PROXY:-none}"
          curl -s --connect-timeout 5 --proxy "${YT_PROXY:-}" https://ifconfig.me || echo "proxy unreachable"

      - name: Restore memory
        run: |
          mkdir -p memory
          if [ -d "hermes-memory" ]; then cp -r hermes-memory/* memory/ 2>/dev/null || true; fi

      - name: Run pipeline
        run: node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |
          mkdir -p memory
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add memory/ output/ && git diff --staged --quiet || (git commit -m "Update $(date +%F)" && git push || true)

      - name: Cleanup
        if: always()
        run: sudo systemctl stop shadowsocks-libev-local@oracle 2>/dev/null || true