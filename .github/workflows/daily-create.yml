name: 🌅 Daily Shorts Creation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode (skip uploads)'
        type: boolean
        default: false
      skip_boost:
        description: 'Skip view boosting'
        type: boolean
        default: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  CHANNEL_NAME: "Mr. WorldWideWebster"

  BOOST_ENABLED: ${{ github.event.inputs.skip_boost == 'true' && 'false' || 'true' }}
  BOOST_MAX_VIEWS: 100

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update -qq

          sudo apt-get install -y \
            ffmpeg \
            yt-dlp \
            curl \
            jq

          sudo apt-get install -y chromium || \
          sudo apt-get install -y chromium-browser || true

          python3 -m pip install -U yt-dlp edge-tts

          echo "✅ Dependencies installed"

      - name: Setup Docker
        run: |
          docker --version

      - name: Build and start Camofox
        run: |
          set -e

          cd /tmp

          echo "📦 Clone"

          git clone https://github.com/jo-inc/camofox-browser.git
          cd camofox-browser

          echo "🛑 Stop default containers"

          make down || true

          echo "🔨 Build image"

          make build

          echo "🔍 Detect image"

          IMAGE=$(docker images \
          --format "{{.Repository}}:{{.Tag}}" \
          | grep '^camofox-browser:' \
          | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "No image found"
            docker images
            exit 1
          fi

          echo "Using image:"
          echo "$IMAGE"

          mkdir -p ~/.camofox-docker

          docker run -d \
            --name camofox-browser \
            --restart unless-stopped \
            -p 9377:9377 \
            -p 6080:6080 \
            -p 5901:5900 \
            -e CAMOFOX_PORT=9377 \
            -e ENABLE_VNC=1 \
            -e VNC_BIND=0.0.0.0 \
            -e VNC_RESOLUTION=1920x1080 \
            -e MAX_OLD_SPACE_SIZE=2048 \
            -v ~/.camofox-docker:/root/.camofox \
            "$IMAGE"

          echo "⏳ Waiting for Camofox"

          for i in {1..30}; do

            if curl -fs http://localhost:9377/health >/dev/null 2>&1
            then
              echo "✅ Camofox healthy"
              break
            fi

            sleep 3
          done

          echo "===== HEALTH ====="

          curl http://localhost:9377/health || true

          echo ""
          echo "===== CONTAINER ====="

          docker ps

          echo ""
          echo "===== LOGS ====="

          docker logs camofox-browser --tail=100 || true

          echo ""
          echo "📺 noVNC:"
          echo "http://localhost:6080"

      - name: Install node packages
        run: |
          npm ci --production || npm install

      - name: Install Hermes
        run: |
          set -e

          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

          hermes config set OPENROUTER_API_KEY "${{ secrets.OPENROUTER_API_KEY }}"
          hermes config set OPENROUTER_MODEL "openrouter/owl-alpha"

          hermes config set DISCORD_BOT_TOKEN "${{ secrets.DISCORD_BOT_TOKEN }}"
          hermes config set DISCORD_CHANNEL_ID "${{ secrets.DISCORD_CHANNEL_ID }}"
          hermes config set YOUTUBE_CHANNEL "${CHANNEL_NAME}"

          mkdir -p ~/.hermes

          cat > ~/.hermes/.env <<EOF
          CAMOFOX_URL=http://localhost:9377
          EOF

          cat > ~/.hermes/config.yaml <<EOF
          browser:
            camofox:
              managed_persistence: true
          EOF

          echo "===== Hermes ENV ====="

          cat ~/.hermes/.env

          echo ""

          echo "===== Hermes CONFIG ====="

          cat ~/.hermes/config.yaml

      - name: Restore memory
        run: |
          mkdir -p ~/.hermes

          if [ -d hermes-memory ]; then
            cp -r hermes-memory/* ~/.hermes/ || true
          fi

          mkdir -p memory

          [ -f memory/channel-memory.json ] || \
          echo '{"initialRun":true}' > memory/channel-memory.json

          [ -f memory/trending-log.json ] || \
          echo '{"trends":[]}' > memory/trending-log.json

      - name: Setup YouTube cookies
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]
          then
            echo "${{ secrets.YOUTUBE_COOKIES }}" \
            > /tmp/youtube_cookies.txt

            echo "✅ Cookies loaded"
          fi

      - name: Run content pipeline
        run: |
          node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |

          mkdir -p hermes-memory

          cp -r ~/.hermes/* hermes-memory/ || true

          git config user.name "Mr. WorldWideWebster Bot"
          git config user.email "bot@worldwidewebster.com"

          git add memory/
          git add hermes-memory/

          git add output/scripts/ 2>/dev/null || true

          if ! git diff --staged --quiet
          then
            git commit -m "📊 Memory update $(date +%F)"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          docker stop camofox-browser || true
          docker rm camofox-browser || true

          rm -rf output/temp || true

          echo "🧹 Cleanup complete"
