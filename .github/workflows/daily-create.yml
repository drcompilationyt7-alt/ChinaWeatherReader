name: Daily Shorts Creation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl unzip
          python3 -m pip install -U pip edge-tts yt-dlp yt-dlp-ejs --break-system-packages
          npm ci || npm install
          npm install axios

      - name: Write cookies file
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "Cookies: $(wc -l < /tmp/yt_cookies.txt) lines"
          else
            echo "WARNING: No YOUTUBE_COOKIES secret set"
          fi

      - name: Restore memory
        run: |
          mkdir -p memory
          if [ -d "hermes-memory" ]; then cp -r hermes-memory/* memory/ 2>/dev/null || true; fi

      - name: Run pipeline
        run: node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add memory/ output/ && git diff --staged --quiet || (git commit -m "Update $(date +%F)" && git push || true)

      - name: Cleanup
        if: always()
        run: rm -rf output/temp 2>/dev/null || true