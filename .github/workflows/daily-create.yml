name: 🌅 Daily Shorts Creation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Run in debug mode"
        type: boolean
        default: false
      skip_boost:
        description: "Skip view boosting"
        type: boolean
        default: false

env:
  # Used by Node-side scripts and Hermes (OpenRouter)
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

  GH_PAT: ${{ secrets.GH_PAT }}

  CHANNEL_NAME: "Mr. WorldWideWebster"

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            yt-dlp \
            jq \
            curl

          sudo apt-get install -y chromium || \
          sudo apt-get install -y chromium-browser || true

          python3 -m pip install -U \
            edge-tts \
            yt-dlp \
            --break-system-packages

          npm ci || npm install

      - name: Start Camofox
        run: |
          docker pull ghcr.io/jo-inc/camofox-browser:latest
          docker run -d \
            --name camofox-browser \
            -p 9377:9377 \
            ghcr.io/jo-inc/camofox-browser:latest

          READY=false
          for i in {1..30}; do
            if curl -fs http://localhost:9377/health >/dev/null; then
              READY=true
              break
            fi
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            docker ps -a
            docker logs camofox-browser || true
            exit 1
          fi
          echo "Camofox ready"

      - name: Install Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

          mkdir -p ~/.hermes
          rm -f ~/.hermes/config.yaml ~/.hermes/.env ~/.hermes/auth.json

          # .env – only the Camofox URL and verbosity (API key comes from the global env)
          cat > ~/.hermes/.env <<'EOF'
          CAMOFOX_URL=http://localhost:9377
          HERMES_VERBOSE=1
          EOF

          # Config with the proper model section for OpenRouter
          cat > ~/.hermes/config.yaml <<'EOF'
          model:
            provider: openrouter
            default: openrouter/owl-alpha
            base_url: ''
            api_mode: chat_completions

          agent:
            max_turns: 4

          browser:
            provider: camofox
            camofox:
              url: http://localhost:9377
              managed_persistence: true

          memory:
            enabled: true
            char_limit: 2000

          tools:
            browser: true
            terminal: true
            web: true
            skills: true
          EOF

          echo "===== CONFIG ====="
          cat ~/.hermes/config.yaml
          echo "===== HERMES STATUS ====="
          hermes status || true
          echo "===== TEST ====="
          # This will now use OpenRouter with the owl-alpha model (context ≥ 64K)
          hermes -z "Reply only OK"

      - name: Restore memory
        run: |
          mkdir -p ~/.hermes
          mkdir -p memory
          cp -r hermes-memory/* ~/.hermes/ 2>/dev/null || true

      - name: Run content pipeline
        run: |
          node core/github-action-runner.js --mode daily

      - name: Save memory
        run: |
          mkdir -p hermes-memory
          cp -r ~/.hermes/* hermes-memory/ || true

          git config user.name "Mr. WorldWideWebster Bot"
          git config user.email "bot@worldwidewebster.com"

          git add memory/ hermes-memory/

          if ! git diff --staged --quiet; then
            git commit -m "📊 Memory update $(date +%F)"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          docker stop camofox-browser || true
          docker rm camofox-browser || true
          rm -rf ~/.hermes/sessions || true
          rm -rf ~/.hermes/checkpoints || true
