name: 🌙 Midnight Hermes Investigation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
  OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
  OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
  OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
  OPENROUTER_API_KEY_8: ${{ secrets.OPENROUTER_API_KEY_8 }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  hermes-investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl
          npm ci || npm install

      - name: Install Ollama + pull Qwen3 8B
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          sleep 10
          ollama pull qwen2.5:7b
          echo "OLLAMA_HOST=http://localhost:11434" >> $GITHUB_ENV
          echo "OLLAMA_MODEL=qwen2.5:7b" >> $GITHUB_ENV

      - name: Install Hermes CLI
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          mkdir -p ~/.hermes
          cat > ~/.hermes/config.yaml <<'EOF'
          model:
            provider: custom
            default: qwen2.5:7b
            base_url: http://localhost:11434/v1
            api_key: ollama
            api_mode: chat_completions
            ollama_compatible: true
            context_length: 65536
          agent:
            max_turns: 4
          toolsets:
            - web
            - terminal
            - skills
          memory:
            enabled: true
            char_limit: 2000
          EOF
          hermes status || true
          echo "HERMES_CONFIG=$HOME/.hermes/config.yaml" >> $GITHUB_ENV

      - name: Restore Hermes memory
        run: |
          mkdir -p ~/.hermes
          if [ -d "hermes-memory" ]; then cp -r hermes-memory/* ~/.hermes/ 2>/dev/null || true; fi

      - name: Run Hermes CLI investigation
        run: node core/github-action-runner.js --mode nightly

      - name: Save memory
        run: |
          cp -r ~/.hermes/config.yaml ~/.hermes/.env hermes-memory/ 2>/dev/null || true
          git config user.name "Hermes Agent"
          git config user.email "hermes@worldwidewebster.com"
          git add memory/ hermes-memory/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🌙 Hermes nightly: $(date +%Y-%m-%d)"
            git push
          fi

      - name: Cleanup
        if: always()
        run: pkill ollama 2>/dev/null || true