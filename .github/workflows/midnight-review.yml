# 🌙 Mr. WorldWideWebster — Midnight Hermes Investigation
# Runs at midnight: Hermes Agent reviews performance, learns,
# creates new strategies, and saves memory for next daily run.
# Both daily and nightly runs share Hermes memory/skills.

name: 🌙 Midnight Hermes Investigation

on:
  schedule:
    - cron: '0 0 * * *'          # Midnight daily
  workflow_dispatch:

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  CHANNEL_NAME: Mr. WorldWideWebster
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  hermes-investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl
          npm ci || npm install

      - name: Load memory
        run: |
          mkdir -p memory
          echo "📂 Memory loaded"

      - name: Run Hermes investigation
        run: node core/github-action-runner.js --mode nightly

      - name: Save memory & improvements
        run: |
          git config user.name "Hermes Agent"
          git config user.email "hermes@worldwidewebster.com"
          git add memory/ hermes-agent/skills/ output/scripts/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🌙 Hermes nightly: $(date +%Y-%m-%d)"
            git push
            echo "✅ Hermes memory saved to repo"
          else
            echo "ℹ️ No changes"
          fi

      - name: Cleanup
        if: always()
        run: rm -rf output/temp 2>/dev/null || true