name: 📺 Weekly Long-Form Creation

on:
  schedule:
    - cron: '0 0 31 2 *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic for the long-form video'
        type: string
        default: ''
      skip_boost:
        description: 'Skip view boosting'
        type: boolean
        default: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
  OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
  OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
  OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
  OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
  OPENROUTER_API_KEY_8: ${{ secrets.OPENROUTER_API_KEY_8 }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
  CHANNEL_NAME: Mr. WorldWideWebster
  GH_PAT: ${{ secrets.GH_PAT }}
  BOOST_ENABLED: ${{ github.event.inputs.skip_boost == 'true' && 'false' || 'true' }}
  BOOST_MAX_VIEWS: 75

jobs:
  create-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          sudo apt-get install -y -qq chromium-browser 2>/dev/null || true

      - name: Install Node.js deps
        run: |
          cd mr-worldwidewebster
          npm ci --production || npm install

      - name: Install Edge-TTS
        run: pip install edge-tts 2>/dev/null || true

      - name: Load memory
        run: |
          cat mr-worldwidewebster/memory/channel-memory.json 2>/dev/null || echo '{}' > mr-worldwidewebster/memory/channel-memory.json
          echo "✅ Memory loaded"

      - name: Create long-form video
        run: |
          cd mr-worldwidewebster
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            node core/github-action-runner.js --mode weekly --topic "${{ github.event.inputs.topic }}"
          else
            node core/github-action-runner.js --mode weekly
          fi

      - name: Save memory
        run: |
          git config user.name "Mr. WorldWideWebster Bot"
          git config user.email "bot@worldwidewebster.com"
          git add mr-worldwidewebster/memory/
          git add mr-worldwidewebster/output/scripts/
          git add mr-worldwidewebster/output/long-form/
          if ! git diff --staged --quiet; then
            git commit -m "📺 Weekly long-form: $(date +%Y-%m-%d)"
            git push
          fi

      - name: Cleanup
        if: always()
        run: rm -rf mr-worldwidewebster/output/temp 2>/dev/null || true