name: Slow-mo music pool top-up (monthly, automatic)

# Adds new romantic / dreamy / pretty famous songs (trending in women BEAUTY edits; owner 2026-10-20) for the SLOW-MO edit to core/edit/assets/slowmo-music-pool.json with NO manual approval:
# candidates (LLM: songs trending in beauty edits + seed list) -> beauty-fit check (title filter + LLM verdict: no sad / dark /
# breakup / ironic songs; no LLM = seeds only) -> gates (official upload >= 3M views, lyrics exist on LRCLIB (checked, never stored), calm score,
# a hook section with a sung line before it) -> probation (Thompson sampling decides) -> underperformers retired by the daily run.
# Code: core/edit/slowmo_music.py (topup). CPU only. Audio is NOT committed (fetched at render time). No lyrics are written anywhere.
# Off with the repository variable SLOWMO_MUSIC_TOPUP=off. GitHub cron ORs day-of-month and day-of-week, so it fires every Thursday
# and the first step exits unless the day of the month is <= 7 (= the first Thursday). A manual run always goes.

on:
  schedule:
    - cron: '15 6 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the gates and print the verdicts; write and commit nothing'
        required: false
        default: 'false'

concurrency:
  group: slowmo-music-topup
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}   # owner 2026-11-25: main cookies (spare + mining jars both hit "confirm you're not a bot" on GitHub; daily-create uses these and works)
  YT_COOKIES: /tmp/yt_cookies.txt
  YT_MATCH_DAILY: '1'
  YT_JS_RUNTIMES: deno   # 2026-11-25: with node every official upload came back 'This content isn't available' (daily-create, which downloads fine, uses deno)
  LYRICS_NO_STORE: '1'
  MUSIC_KEEP_AUDIO: '0'
  MUSIC_POOL_CACHE: /tmp/music-pool-audio

jobs:
  topup:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: vars.SLOWMO_MUSIC_TOPUP != 'off'
    permissions:
      contents: write
    steps:
      - name: First Thursday only (scheduled runs)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -gt 7 ]; then
            echo "Not the first Thursday of the month: nothing to do."; echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "go=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.11'
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get install -y -qq ffmpeg || true
          python -m pip install -U "yt-dlp[default]" "librosa==0.11.0" numpy scipy soundfile psutil
          if [ -n "$YOUTUBE_COOKIES" ]; then printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt; fi
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          "$HOME/.deno/bin/deno" --version | head -1; yt-dlp --version
      - name: Selftest
        if: steps.gate.outputs.go == 'true'
        run: python core/edit/slowmo_music.py selftest
      - name: Kaggle CLI
        if: steps.gate.outputs.go == 'true' && vars.MINE_ON_KAGGLE != 'off'
        run: python -m pip install -q kaggle six
      - name: Top-up on Kaggle (song ideas from the LLM here, YouTube search / download / gates on Kaggle, audio stored here)
        # 2026-11-27: GitHub runners cannot download from YouTube at all; API keys never leave GitHub
        if: steps.gate.outputs.go == 'true' && vars.MINE_ON_KAGGLE != 'off'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          DRY=""; [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          python core/edit/slowmo_music.py topup --cands-out /tmp/cands.json
          python scripts/kaggle_run.py --slug topup-slowmo --inputs /tmp/cands.json             --outputs core/edit/assets/slowmo-music-pool.json memory /tmp/music-pool-audio             --pip "yt-dlp[default] yt-dlp-ejs deno librosa<0.11 soundfile" --apt ffmpeg --wait-min 140             --env MUSIC_KEEP_AUDIO=1 --env MUSIC_POOL_CACHE=/tmp/music-pool-audio --env MUSIC_AUDIO_RELEASE_OFF=1             --env YT_JS_RUNTIMES=deno --env PYTHONIOENCODING=utf-8 -- "python core/edit/slowmo_music.py topup --cands-in /tmp/cands.json $DRY"
          if [ -z "$DRY" ]; then MUSIC_POOL_CACHE=/tmp/music-pool-audio python core/edit/music_pool.py push-audio; fi
      - name: Top-up
        if: steps.gate.outputs.go == 'true' && vars.MINE_ON_KAGGLE == 'off'
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then python core/edit/slowmo_music.py topup --dry-run; else python core/edit/slowmo_music.py topup; fi
      - name: Commit the pool + the monthly report
        if: steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Bot" && git config user.email "bot@bot.com"
          git add core/edit/assets/slowmo-music-pool.json memory/slowmo-music-topup-*.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Slow-mo music pool top-up $(date +%F)"
          for i in 1 2 3; do git -c rebase.autoStash=true pull --rebase -X theirs origin main && git push && break; sleep 5; done
